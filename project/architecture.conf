# The package edges between modules (docs/redesign/ARCHITECTURE.md, sections 5 and 11), read by core's
# ArchitectureSuite. A line `m -> a, b.c` says what module m's main sources may name of other modules: a module (any
# of its packages), or a package and its subpackages. A module's test sources may name the same, what those modules
# may in turn, and the modules of the test-only edges (`tests m -> a`, build.sbt's "test->test"). The build gives
# the classpath; this file narrows it to what is meant.
dsl -> core
proof -> core
eval -> core, dsl
testing -> core, dsl, eval
# Owner §15's kinds of node (`spec.NodeKind`) and the names a decision is about; nothing else of core.
decision -> core.name, core.graph, core.spec
wire -> core, eval, proof, decision, testing
project -> core, eval, proof, decision, testing, wire
api -> core, dsl, eval, proof, decision, testing, wire, project
# The front ends: never project, proof, testing or wire (their own ArchitectureSuites check the compiled classes too).
cli -> core, dsl, eval, decision, api
web -> core, eval, decision, api
agent -> core, decision, api, cli, web

tests proof -> core
tests eval -> proof
tests testing -> eval
tests project -> testing
tests api -> project

# Where a lock may be taken (`Mutex`, `synchronized`, `java.util.concurrent.atomic`), as `lock module.package.File`:
# production's interpreter of flows, and the stores that serialize their own reads and writes.
lock eval.Running
lock eval.flow.FlowInterpreter
# The World a transaction holds one lock over.
lock eval.flow.World
# Interleavings pause the calls of two runs at once, one at a time.
lock testing.Interleavings
# The shell's ledger and Lake builds: one write, one build at a time, in the live and the in-memory interpreters.
lock project.port.LedgerStore
lock project.port.Lake
lock project.port.memory.MemoryLedger
# The agent's records, written one at a time.
lock agent.store.FileStore
lock agent.store.MemoryStore

# What may read the disk in core, dsl, proof or decision: a macro, which reads it at compile time, in the compiler.
io dsl.build.SourceFiles

# The package cycles inside a module, as `cycle a, b`, each a package and the ones it is made of or two that share
# their types; the suite fails on any other cycle, and on one listed here that is gone, so the list only shrinks.
# Breaking one moves files between packages across its module: a refactoring of its own, not done in step 14.
# The term algebra (`term.Sym`) and its parts (`term.algebra`), which take its binders and bodies.
cycle core.term, core.term.algebra
# Validation and its outside and refused checks, which read what the analysis resolves.
cycle core.analysis, core.analysis.outside, core.analysis.refused
# A Definition's type names `Flow`, and a flow calls Definitions.
cycle dsl.flow, dsl.vocab
# The obligations and the tries of each, which take the obligation they try.
cycle proof.obligation, proof.obligation.tried
# Lowering and the Lean of terms, each printing through the other.
cycle proof.lean.lower, proof.lean.term
# A layout audits itself; the audit reads the layout's parts.
cycle proof.audit, proof.layout
# The evaluator, its flows, runs and terms, over the values in the module's own package.
cycle eval, eval.flow, eval.run, eval.term
# The tests, their reports, model runs and derived cases.
cycle testing, testing.derive, testing.model, testing.report
# The API's algebras and their interpreters (`api.shell`, private to the API), its constructors in `FrFlowApi`.
cycle api, api.shell
