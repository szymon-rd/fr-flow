# The package edges between modules (docs/redesign/ARCHITECTURE.md, sections 5 and 11), read by core's
# ArchitectureSuite. A line `m -> a, b.c` says what module m's main sources may name of other modules: a module (any
# of its packages), or a package and its subpackages. A module's test sources may name the same, what those modules
# may in turn, and the modules of the test-only edges (`tests m -> a`, build.sbt's "test->test"). The build gives
# the classpath; this file narrows it to what is meant. Edges are per module (only decision's are narrowed to
# packages); inside a module the suite asks for no package cycle. FrFlow's examples (examples/*) are projects of
# their own, which no module's main sources name; testing's tests depend on their models.
dsl -> core
proof -> core
eval -> core, dsl
testing -> core, dsl, eval
# Owner §15's kinds of node (`spec.NodeKind`) and the names a decision is about; nothing else of core.
decision -> core.name, core.graph, core.spec
wire -> core, eval, proof, decision, testing
project -> core, eval, proof, decision, testing, wire
api -> core, dsl, eval, proof, decision, testing, wire, project
# The front ends: never project, proof, testing or wire (their own ArchitectureSuites check the compiled classes too).
cli -> core, dsl, eval, decision, api
web -> core, eval, decision, api
agent -> core, decision, api, cli, web

# What an example (examples/NAME) names of FrFlow, as `example PART -> package, …`, each package exactly (not its
# subpackages): its model (its statements, code and tests) only the facade, `frflow` (`import frflow.*`: `Gen` and
# the test clock `Wall` among its names); its app (app/, the composition root) the front ends' entry points too,
# `frflow.cli.FrFlowApp` and `frflow.agent.Agent`. No other helper is an example's.
example model -> frflow
example app -> frflow, frflow.cli, frflow.agent

tests proof -> core
tests eval -> proof
tests testing -> eval
tests project -> testing
tests api -> project

# The exceptions the suite admits, each an implementation note of step 14 (ARCHITECTURE.md section 11, rule 2), to
# be removed when the reason given goes; the suite counts them, so a new one changes it too.

# Where a lock may be taken (`Mutex`, `Semaphore`, `synchronized`, an atomic or a lock of the JDK's), as
# `lock module.package.File`. Production's interpreter of flows (rule 2's two places), and the World a transaction
# holds its one lock over:
lock eval.run.Running
lock eval.flow.FlowInterpreter
lock eval.flow.World
# Interleavings pause the calls of two runs at once, one at a time: a test harness serializing model calls.
lock testing.Interleavings
# The shell's ledger file and Lake's builds, and the agent's record files: a write of a file, or a build, one at a
# time. A `Ref` cannot hold an effect's critical section; the in-memory stores use `Ref.modify` alone.
lock project.port.LedgerStore
lock project.port.Lake
lock agent.store.FileStore

# What may read the disk in core, dsl, proof or decision: a macro, which reads it at compile time, in the compiler
# (`SourceFiles`: the files plain code refers to; `Source.relative`, the build's directory, reads no file).
io dsl.build.SourceFiles
# What compiles a class from its TASTy as a model is built reads the `.tasty` files the Scala compiler wrote beside
# the class's class file, and the classpath their names resolve in (`lifted[RecordedLimits]`): a compiler's input,
# read where the model's code is, not where a statement is decided.
io dsl.compiled.Inspect

# The package cycles inside a module, as `cycle a, b`; the suite fails on any other cycle, and on one listed here
# that is gone. Lowering a term and lowering a program call each other (a term holds a run of a program, a program's
# steps hold terms: LowerEnv, LowerModels, LowerProg, Printed, LeanTerm, LowerValue, LowerFaults, one strongly
# connected set of files); one package would hold 21 files, over the budget of 15. To be removed when the lowering
# of a program's steps takes the term printer as a parameter.
cycle proof.lean.lower, proof.lean.term
# The API's algebras and their interpreters (`api.shell`, private to the API, so front ends cannot name it), its
# public constructors in `FrFlowApi`'s companion. To be removed when the constructors move to a public package of
# their own over the shell, a change to every front end's composition root.
cycle api, api.shell
