// ---- Loading, and the controls ----
/** The view read afresh; `again` shows the details again (after a check or a decision). */
async function load(again) {
  const [view, serving, inbox, vocab] = await Promise.all([call("GET", "/api/view"), call("GET", "/api/serving"),
    call("GET", "/api/inbox"), call("GET", "/api/vocabulary")]);
  state.vocab = vocab.ok ? vocab.json : null;
  if (!view.ok) { $("stage").innerHTML = `<p class="fail" style="padding:40px">${esc(failure(view.json))}</p>`; return; }
  state.view = view.json;
  state.inbox = inbox.ok ? inbox.json : [];
  state.sources.clear();
  state.serving = serving.ok ? serving.json : null;
  banner();
  $("n-inbox").textContent = state.inbox.length || "";
  $("n-status").textContent = state.view.warnings.length || "";
  if (serving.ok && !$("checked").dataset.ran) $("checked").textContent = `deciding as ${serving.json.developer}`;
  drawKey(); drawMap();
  if (state.drawer) showDrawer();
  if (state.panel && state.open && node(state.open) && (again === true || !$("panel").classList.contains("on"))) details(state.open);
  state.extensions.forEach(x => x.panel && x.panel($("panels"), state.view));
  if (state.code && state.open && node(state.open)) code(state.open, state.code);
}

// ---- Live: the project read again whenever it moves ----
const live = { version: null, down: false };
/** What the server is doing, when it is not just serving: rebuilding the model, or serving one that moved. */
function banner() {
  const s = state.serving, b = $("changed");
  const text = live.down ? "Rebuilding the model… the page follows when the server is back." :
    s && s.modelChanged && s.reloads ? "The model's sources changed: rebuilding it…" :
    s && s.modelChanged ? "The model changed since this server started. Restart serve before deciding." : "";
  b.hidden = !text; b.textContent = text;
}
/** The project's version, every 1.5 s while the page is shown: when it moves (a decision, a request, the server
  * started again on a rebuilt model), the project is read again and what is new is played on the map.
  */
async function poll() {
  if (!run.on && !document.hidden) {
    try {
      const r = await call("GET", "/api/version");
      if (live.down) { live.down = false; banner(); }
      if (r.ok && live.version !== r.json.version) {
        const first = live.version === null;
        live.version = r.json.version;
        if (!first) await load();
      }
    } catch (e) { if (!live.down) { live.down = true; banner(); } }
  }
  setTimeout(poll, 1500);
}

// ---- The check: Rocq's progress, level by level, as it streams ----
const run = { on: false, levels: [], started: 0, timer: null };
function busy(ids) {
  $("stage").querySelectorAll(".mk").forEach(m => m.classList.toggle("busy", ids.includes(m.dataset.node)));
}
function drawRun(final, stopped) {
  const lv = run.levels, last = lv[lv.length - 1];
  $("run-bar").style.width = final ? "100%" : last ? `${Math.round(((last.step - 1) / last.of) * 100 + 100 / last.of / 2)}%` : "4%";
  $("run-b").innerHTML = (lv.length ? "" : '<div class="lvl now"><div class="lvl-h"><span class="spin"></span>Writing the Rocq and ' +
      "starting Lake…</div></div>") +
    lv.map((l, i) => { const now = !final && i === lv.length - 1, broke = stopped && i === lv.length - 1;
      return `<div class="lvl${now ? " now" : ""}"><div class="lvl-h">${now ? '<span class="spin"></span>' :
        broke ? '<span class="g fail">✗</span>' : '<span class="g">✓</span>'}` +
        `Level ${l.step} of ${l.of}<span class="st">${l.nodes.length} ${l.nodes.length === 1 ? "node" : "nodes"}</span></div>` +
        `<div class="lvl-n">${l.nodes.map(hop).join("")}</div></div>`; }).join("") + (final || "");
  $("run-b").querySelectorAll("[data-hop]").forEach(b => b.onclick = () => expand(b.dataset.hop));
  $("run-b").scrollTop = $("run-b").scrollHeight;
}
/** Every node the check went through, as it stands after it: re-checked by Rocq now, or kept because its check
  * was still current (nothing it rests on changed).
  */
function summary(rerun, v) {
  const all = [...new Set(run.levels.flatMap(l => l.nodes))], fresh = new Set(rerun);
  const ns = all.map(id => v.nodes.find(n => n.id === id)).filter(Boolean);
  const rank = n => proofOf(n)[2] ? 0 : n.proof.state.type === "Proven" ? 2 : 1;
  const bad = ns.filter(n => proofOf(n)[2]).length, ok = ns.filter(n => n.proof.state.type === "Proven").length;
  const again = ns.filter(n => fresh.has(n.id)).length;
  return `<div class="lvl"><div class="lvl-h" style="color:var(--ink)">${bad ? `<span class="g fail">✗</span>${bad} failing, ` :
      '<span class="g">✓</span>'}${ok} of ${ns.length} proven</div><p class="muted" style="margin:4px 0 6px;font-size:12.5px">` +
    (again ? `Rocq re-checked ${again}; the rest were still current.` : "Nothing changed since the last check: every result was kept.") +
    "</p>" + ns.sort((a, b) => rank(a) - rank(b)).map(n => { const [g, gw, f] = proofOf(n);
      return `<div class="res"><span class="g ${f ? "fail" : ""}">${g || "·"}</span>${hop(n.id)}<span class="muted">${gw}` +
        `${fresh.has(n.id) ? ", re-checked" : ", kept"}</span></div>`; }).join("") + "</div>";
}
const clock = () => { const s = Math.round((Date.now() - run.started) / 1000);
  $("run-clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
$("run-x").onclick = () => { $("run").classList.remove("on"); };
$("check").onclick = async () => {
  if (run.on) { $("run").classList.add("on"); return; }
  Object.assign(run, { on: true, levels: [], started: Date.now() });
  $("check").disabled = true; $("check").textContent = "Checking…";
  $("run").classList.add("on"); $("run-t").textContent = "CHECKING WITH LEAN";
  clock(); run.timer = setInterval(clock, 1000); drawRun();
  const end = (html, label) => { clearInterval(run.timer); clock(); busy([]); run.on = false;
    $("check").disabled = false; $("check").textContent = "Check"; $("run-t").textContent = label;
    drawRun(html, label === "CHECK STOPPED"); };
  try {
    const r = await fetch("/api/check/live", { method: "POST", headers: { "X-FrFlow-Token": token, "Content-Type": "application/json" } });
    if (!r.ok) { const j = await r.json().catch(() => ({})); end(`<p class="fail">${esc(failure(j))}</p>`, "CHECK STOPPED"); return; }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", done = null;
    for (;;) {
      const { value, done: over } = await reader.read();
      if (over) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const e = JSON.parse(line);
        if (e.type === "Level") { run.levels.push(e); busy(e.nodes); drawRun(); }
        else if (e.type === "Done") done = e;
        else { end(`<p class="fail">${esc(e.stop ? failure({ stop: e.stop }) : e.error)}</p>`, "CHECK STOPPED"); return; }
      }
    }
    if (!done) { end('<p class="fail">The check ended without its result.</p>', "CHECK STOPPED"); return; }
    $("checked").dataset.ran = "1";
    $("checked").textContent = (done.checked.length ? `re-checked ${done.checked.length}` : "all current") + " at " +
      new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    end(summary(done.checked, done.after), "CHECKED");
    await load(true);
  } catch (err) { end(`<p class="fail">${esc(String(err))}</p>`, "CHECK STOPPED"); }
};
document.querySelectorAll("[data-drawer]").forEach(b => b.onclick = () => drawer(b.dataset.drawer));

$("z-out").onclick = () => { const r = $("map").getBoundingClientRect(); zoom(0.8, r.width / 2, r.height / 2); };
