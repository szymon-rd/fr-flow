# FrFlow's CI: the budgets, `sbt test`, and the suites that run Lean end to end (tagged `Lean`, left out of
# `sbt test`: build.sbt's `Lean` configuration, its `leanTest` alias running them in every module). Every push and pull request runs them on the laws' usual seeds;
# the nightly run draws the laws' terms from seeds no other run uses (`FRFLOW_LAW_SEEDS`, `from:count`).
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SBT_OPTS: "-Xmx6g -Xss8m"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Every Lean project names one toolchain
        run: |
          versions=$(find . -name lean-toolchain -not -path '*/.lake/*' -not -path '*/target/*' -exec cat {} + | sort -u)
          echo "$versions"
          test "$(echo "$versions" | wc -l)" -eq 1

      - name: Cache the Lean toolchain (elan)
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('**/lean-toolchain') }}

      # elan pinned to a release: its own installer binary (elan-init.sh fetches whatever release is latest).
      - name: Install elan v4.2.4 and the toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
              | tar -xz -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat next/proof/lean/lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat next/proof/lean/lean-toolchain)"

      - name: Lean and Lake
        run: lean --version && lake --version

      - name: Nightly seeds
        if: github.event_name == 'schedule'
        run: echo "FRFLOW_LAW_SEEDS=$(( GITHUB_RUN_NUMBER * 10000 + 1 )):1500" >> "$GITHUB_ENV"

      - name: Budgets
        run: python3 docs/redesign/tools/test_budget.py && python3 docs/redesign/tools/budget.py next

      - name: sbt test
        run: sbt test < /dev/null

      - name: The suites that run Lean
        run: sbt leanTest < /dev/null
