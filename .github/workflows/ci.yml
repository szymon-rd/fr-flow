# FrFlow's CI: the budgets, `sbt test`, and the suites that run Rocq end to end (tagged `Rocq`, left out of
# `sbt test`: build.sbt's `Rocq` configuration, its `rocqTest` alias running them in every module). Every push and
# pull request runs them on the laws' usual seeds;
# the nightly run draws the laws' terms from seeds no other run uses (`FRFLOW_LAW_SEEDS`, `from:count`).
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SBT_OPTS: "-Xmx6g -Xss8m"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Cache Rocq (opam)
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-rocq-prover-9

      # The newest Rocq, through opam on the system's OCaml: what `frflow check` and the suites tagged `Rocq` call.
      - name: Install Rocq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ocaml opam libgmp-dev pkg-config
          export OPAMYES=1
          [ -d "$HOME/.opam" ] || opam init --bare --disable-sandboxing --no-setup
          opam switch list --short | grep -qx rocq || opam switch create rocq ocaml-system
          opam install --switch=rocq -j 4 rocq-prover
          echo "$HOME/.opam/rocq/bin" >> "$GITHUB_PATH"

      - name: Rocq
        run: rocq --version

      - name: Nightly seeds
        if: github.event_name == 'schedule'
        run: echo "FRFLOW_LAW_SEEDS=$(( GITHUB_RUN_NUMBER * 10000 + 1 )):1500" >> "$GITHUB_ENV"

      - name: Budgets
        run: python3 bin/test_budget.py && python3 bin/budget.py modules examples

      - name: sbt test
        run: sbt test < /dev/null

      - name: The suites that run Rocq
        run: sbt rocqTest < /dev/null
