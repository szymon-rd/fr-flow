  if (x.length * y.length > 250000) return `<del class="w">${esc(a)}</del>\n<ins class="w">${esc(b)}</ins>`;
  const m = x.length, n = y.length, L = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < m && j < n) {
    if (x[i] === y[j]) { out += esc(x[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { out += `<del class="w">${esc(x[i++])}</del>`; }
    else { out += `<ins class="w">${esc(y[j++])}</ins>`; }
  }
  while (i < m) out += `<del class="w">${esc(x[i++])}</del>`;
  while (j < n) out += `<ins class="w">${esc(y[j++])}</ins>`;
  return out;
}

// Line by line, with the unchanged lines between changes folded away (one kept on each side).
function lineDiff(a, b) {
  const x = (a || "").split("\n"), y = (b || "").split("\n");
  if (x.length * y.length > 250000) return `<del class="w">${esc(a)}</del>\n<ins class="w">${esc(b)}</ins>`;
  const m = x.length, n = y.length, L = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < m || j < n) {
    if (i < m && j < n && x[i] === y[j]) { ops.push(["=", x[i]]); i++; j++; }
    else if (j < n && (i === m || L[i][j + 1] >= L[i + 1][j])) ops.push(["+", y[j++]]);
    else ops.push(["-", x[i++]]);
  }
  const near = k => [k - 1, k, k + 1].some(q => ops[q] && ops[q][0] !== "=");
  const out = []; let skipped = 0;
  ops.forEach(([o, t], k) => {
    if (o === "=" && !near(k)) { skipped++; return; }
    if (skipped) { out.push(`<span class="muted">… ${skipped} unchanged line(s)</span>`); skipped = 0; }
    out.push(o === "=" ? esc(t) : o === "+" ? `<ins class="w">${esc(t)}</ins>` : `<del class="w">${esc(t)}</del>`);
  });
  if (skipped) out.push(`<span class="muted">… ${skipped} unchanged line(s)</span>`);
  return out.join("\n");
}

// Examples under the values they are given, each group once: a new binding is one line, not every example again.
function exampleLines(es) {
  const out = []; let given = null;
  for (const e of es || []) {
    const m = e.match(/^(.*?)  given (.*?)  — (.*)$/s);
    if (!m) { out.push(e); continue; }
    if (m[2] !== given) { given = m[2]; out.push(`given ${given || "nothing"}`); }
    out.push(`  ${m[1]}  — ${m[3]}`);
  }
  return out.join("\n");
}

function diff(old, cur) {
  const flat = c => ({
    kind: c.kind, parents: (c.parents || (c.parent ? [c.parent] : [])).join(", "), parts: (c.parts || []).join("\n"), replaces: c.replaces, operation: c.op,
    statement: c.statement, why: c.why, idea: c.idea, "not modelled": c.notModelled,
    ...Object.fromEntries(Object.entries(c.sources || {})),
    substitutions: (c.substitutions || []).join("\n"), examples: exampleLines(c.examples),
    implementation: c.implementation, vocabulary: (c.vocabulary || []).join("\n"), "definitions used": (c.uses || []).join("\n\n"), governs: (c.governs || []).join("\n"),
    "invariants kept": (c.keeps || []).join("\n"), "relies on": (c.relies || []).join("\n"), "out of Lean": c.formal === false ? "yes" : "",
    "definition (as written)": c.definition,
  });
  const a = flat(old || {}), b = flat(cur || {});
  const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(k => (a[k] || "") !== (b[k] || ""));
  if (!keys.length) return "";
  // What it says formally moved, and the words did not: do they still say it?
  const formal = keys.filter(k => ["spec", "formula", "post", "rule"].includes(k));
  const stale = formal.length && !keys.includes("statement")
    ? `<div class="warn-text small">Its ${formal.join(", ")} changed, and its statement did not: does the statement still say what it now means?</div>` : "";
  return stale + keys.map(k => `<div class="side"><div class="label">${esc(k)}</div><pre class="worddiff">${wordDiff(a[k], b[k], byLine.has(k))}</pre></div>`).join("");
}

async function loadCodeDiff(id) {
  if (state.codeDiffs[id] !== undefined) return;
  const diffs = state.codeDiffs; // replaced on every refresh: a diff for an older load is dropped
  diffs[id] = null;
  let d = "";
  try { d = (await api(`${P()}/codediff?node=${encodeURIComponent(id)}`)).diff; } catch {}
  if (state.codeDiffs !== diffs) return;
  diffs[id] = d;
  if (state.selected === id && state.tab === "node") renderPane();
}

const reasonBox = (placeholder, value = "", n = null) =>
  `<div class="side"><div class="label">your reason (kept as part of the theory)</div><textarea id="reason" rows="2" placeholder="${esc(placeholder)}">${esc(value)}</textarea>
  </div>`;

// What is not proven or fails (from core: Decisions.unproven), and a spec that says what a sibling's does.
const warnings = n => [...(n.unproven || []), ...((n.sameAs || []).length ? [`its spec says formally what ${n.sameAs.join(", ")} says: its statement must not claim more`] : [])];

// What moved since the decision, shown whether or not it can be accepted yet.
function whatMoved(n) {
  const d = n.history?.filter(h => h.binds).slice(-1)[0];
  let h = "";
  for (const c of n.causes || []) {
    if (c === "self") h += `<div class="side"><div class="label">${esc(n.id)} changed since it was accepted</div>${diff(d?.content, n.content) || `<div class="muted small">No difference in what was decided.</div>`}</div>`;
    if (c === "above") for (const p of parentsOf(n).filter(p => byId(p)?.state === "rejected"))
      h += `<div class="side"><div class="label"><a data-goto="${esc(p)}">${esc(p)}</a>, which it rests on, was rejected</div><div class="muted small">The agent moves it under the node chosen instead, or removes it.</div></div>`;
    if (c === "parts") {
      // Its parts are part of what was decided: a part added or removed puts it up for review.
      const before = d?.content?.parts, now = n.parts || [];
      const added = before ? now.filter(x => !before.includes(x)) : [], removed = before ? before.filter(x => !now.includes(x)) : [];
      h += `<div class="side"><div class="label">its parts changed since it was decided</div>${before
        ? `${added.length ? `<div class="small">added: ${added.map(x => `<a data-goto="${esc(x)}">${esc(x)}</a>`).join(", ")}</div>` : ""}${removed.length ? `<div class="small">removed: ${removed.map(x => `<b>${esc(x)}</b>`).join(", ")}</div>` : ""}${!added.length && !removed.length ? `<div class="small">reordered: ${now.map(esc).join(", ")}</div>` : ""}`
        : `<div class="small">now: ${now.map(x => `<a data-goto="${esc(x)}">${esc(x)}</a>`).join(", ") || "none"}</div>`}
        <div class="muted small">Do these parts, together, still make it? The table below says what Lean shows.</div></div>`;
    }
    if (c === "above") for (const m of n.moved || []) {
      const a = byId(m.id);
      // A change above that the developer has already accepted: one line, the diff folded away.
      h += a?.state === "accepted"
        ? `<div class="side"><div class="label"><a data-goto="${esc(m.id)}">${esc(m.id)}</a> changed in meaning; you accepted that: ${esc(a.reasonNow || "")}</div><details><summary class="small">what changed</summary>${diff(m.before, C(a)) || ""}</details></div>`
        : `<div class="side"><div class="label"><a data-goto="${esc(m.id)}">${esc(m.id)}</a> changed in meaning since this was decided</div>${diff(m.before, C(a)) || ""}</div>`;
    }
    if (c === "revisit") {
      const r = (n.history || []).filter(x => x.action === "revisit").slice(-1)[0];
      h += `<div class="side"><div class="label">${esc(r?.by || "")} asked to revisit it</div>${esc(r?.reason || "")}</div>`;
    }
    if (c === "code") {
      loadCodeDiff(n.id);
      const cd = state.codeDiffs[n.id];
      h += `<div class="side"><div class="label">the code it governs changed: ${esc((n.code?.files || []).join(", "))}</div>
        ${cd === null || cd === undefined ? `<div class="muted small">loading the diff…</div>` : cd ? `<pre class="mono">${esc(cd)}</pre>` : `<div class="muted small">No diff available (the change was made before the decision was committed, or outside git). The examples ${examplesBad(n).length ? "fail" : "still pass"}.</div>`}</div>`;
    }
  }
  return h;
}

// What a node governs, in full, before it is first decided: what is accepted is seen.
function governedFiles(n) {
  loadCodeDiff(n.id);
  const cd = state.codeDiffs[n.id];
  return `<details><summary>the files it governs, in full (${esc((n.code.files || []).join(", "))}) — read them before accepting</summary>
    ${cd === null || cd === undefined ? `<div class="muted small">loading…</div>` : `<pre class="mono">${esc(cd)}</pre>`}</details>`;
}

// A node waiting for you shows what to decide first; the rest is there to read below it.
const needsYou = n => ["proposed", "review"].includes(n.state);
// A decision that says when to revisit it is answered by name (the server decides which: Decisions.conditional).
const conditional = b => !!b.conditional;

// The decisions above a new node, with their reasons: where "revisit if …" is written.
function aboveReasons(n) {
  const above = [...ancestors(n.id), ...usesOf(n).filter(d => !ancestors(n.id).includes(d))].filter(a => a.decision);
  const invs = (n.invariants || []).filter(i => byId(i.id));
  const like = (n.resembles || []).map(x => `<div class="warn-text">It says what <a data-goto="${esc(x.id)}">${esc(x.id)}</a> said, which was rejected: ${esc(x.reason)}</div>`).join("") +
    // The options turned down here before, with why: a new proposal may be one of them in other words.
    ((n.state === "proposed" && (n.rejectedBeside || []).length) ? `<div class="side"><div class="label">rejected here before (is this one of them?)</div>
      ${n.rejectedBeside.map(x => `<div class="small"><b>${esc(x.id)}</b>: ${esc(x.statement)} <span class="muted">— rejected because ${esc(x.reason)}</span></div>`).join("")}</div>` : "");
  const relied = (n.relies || []).map(byId).filter(Boolean);
  if (!above.length && !invs.length && !relied.length) return like;
  // A reason above that says when to revisit it is answered by name, as below.
  const ask = id => (n.conditionsAbove || []).includes(id) ? ` <span class="small">
    <label><input type="radio" class="ans" name="ans-${esc(id)}" value="held" data-id="${esc(id)}"> still holds</label>
    <label><input type="radio" class="ans" name="ans-${esc(id)}" value="revisit" data-id="${esc(id)}"> revisit ${esc(id)}</label></span>` : "";
  return like + `<div class="side"><div class="label">what it rests on, with the reasons: does this meet a condition they set for revisiting them?</div>
    ${above.map(a => `<div class="small"><a data-goto="${esc(a.id)}"><b>${esc(a.id)}</b></a>: ${esc(a.reasonNow || a.decision?.reason || "")}${ask(a.id)}</div>`).join("")}
    ${invs.map(i => `<div class="small"><a data-goto="${esc(i.id)}"><b>${esc(i.id)}</b></a>: ${i.status === "exempt" ? `exempt, because ${esc(i.detail)} — still true?` : esc(byId(i.id).reasonNow || byId(i.id).decision?.reason || "")}${ask(i.id)}</div>`).join("")}
    ${relied.filter(r => !above.some(a => a.id === r.id)).map(r => `<div class="small">relies on <a data-goto="${esc(r.id)}"><b>${esc(r.id)}</b></a>: ${esc(r.reasonNow || r.decision?.reason || "")}${ask(r.id)}</div>`).join("")}</div>`;
}

// Back to the agent, with what to change: a request on the node.
const sendBack = n => `<button class="btn small" data-sendback="${esc(n.id)}">Send back to the agent</button>`;

// The reasons on a node: the one that binds now (the last accept or confirm) first, the rest of its
// history collapsed, the original choice among them. Migrations change the format, not the theory: not listed.
const lastBinding = n => (n.history || []).filter(h => ["accept", "confirm"].includes(h.action)).slice(-1)[0] || n.decision;
function reasons(n) {
  const d = n.decision, latest = lastBinding(n);
  if (!latest) return "";
  const isChoice = h => d && h.at === d.at && h.action === d.action;
  const verb = h => isChoice(h) ? "chosen" : h.action === "accept" ? "change accepted" : VERB[h.action] || h.action;
  const when = h => h.at ? new Date(h.at).toLocaleString() : "";
  const hs = n.history || [], i = hs.indexOf(latest);
  const earlier = (i < 0 ? hs : hs.slice(0, i)).filter(h => h.action !== "migrate").reverse();
  return `<div class="why"><div class="label">${verb(latest)} by ${esc(latest.by)}${latest.at ? `, ${when(latest)}` : ""}, because</div>${esc(latest.reason)}</div>
    ${earlier.length ? `<details class="earlier"><summary>Earlier reasons (${earlier.length})</summary>${earlier.map(h =>
      `<div class="small" style="margin-top:4px"><span class="muted">${esc(verb(h))} by ${esc(h.by)}, ${when(h)}:</span> ${esc(h.reason)}</div>`).join("")}</details>` : ""}`;
}

const mechanicalNote = n => n.mechanical ? `<div class="muted small">Mechanical: Lean proves it again and nothing in it is a choice. Accept it here, or with the other mechanical decisions in the Inbox, with one reason.</div>` : "";

// The parts of a node, decided with it: each needed or not, and whether together they make it.
function partsTable(n) {
  const sp = n.split;
  if (!sp) return "";
  const rows = (sp.needed || []).map(x => { const p = byId(x.id);
    const check = p?.status && !fine(p.status) ? `<div class="muted tiny">its check: ${esc(p.status)}</div>` : "";
    return `<tr><td><a data-goto="${esc(x.id)}"><b>${esc(x.id)}</b></a>${p ? `<div><span class="kind ${kindOf(p)}">${esc(kindOf(p))}</span></div>` : ""}</td>
      <td class="small">${esc(p ? C(p).statement : "(not in the model)")}</td><td>${neededChip(x)}</td><td>${p ? `<span class="chip s-${p.state}">${esc(p.state)}</span>` : ""}${check}</td></tr>`; }).join("");
  const c = sp.complete || {}, k = sp.clash || {};
  const complete = { proven: c.detail === "authored" ? "The parts make it, by a proof the agent wrote (checked by Lean, axioms audited): read it before accepting."
      : "The parts make it: proven automatically.", open: `Not shown that the parts make it: ${c.detail || "open"}.`, failed: `Failed: ${c.detail || ""}`,
    unchecked: `Not checked yet: ${c.detail || "press Check"}.`, timeout: "Lean timed out: run Check again.", informal: "Not formalized: whether the parts make it is decided by reading them." }[c.status] || `${c.status}: ${c.detail || ""}`;
  const clash = { proven: "The parts do not contradict each other, as far as Lean shows.", failed: `The parts contradict each other: ${k.detail || ""}`,
    informal: "Not formalized.", unchecked: "Not checked yet." }[k.status] || `${k.status}: ${k.detail || ""}`;
  const notNeeded = (sp.needed || []).filter(x => x.status === "open");
  const one = (sp.needed || []).length === 1;
  return `<table class="parts"><tr><th>part</th><th>statement</th><th>needed</th><th>status</th></tr>${rows}</table>
    <div class="result"><span class="chip ${chipClass(c.status)}">complete</span><span>${esc(complete)}</span></div>
    ${notNeeded.length ? `<div class="result"><span class="chip s-open">needed</span><span>${one
      ? `Lean shows ${esc(n.id)} without its part: it says nothing its part adds (${esc(notNeeded[0].detail || "")}).`
      : `Lean shows ${esc(n.id)} without ${notNeeded.map(x => esc(x.id)).join(", ")}: ${notNeeded.length > 1 ? "they are" : "it is"} not needed for it.`}</span></div>` : ""}
    <div class="result"><span class="chip ${k.status === "proven" ? "s-proven" : k.status === "failed" ? "s-failed" : "s-not-checked"}">clash</span><span>${esc(clash)}</span></div>`;
}

// What the root says of the code: doing nothing does not meet it (idle), and root_impl from what is trusted.
function rootBlock(n) {
  if (!isRoot(n)) return "";
  const ri = n.rootImpl, tr = (snap()?.trusted || []).map(id => byId(id) || { id, kind: "?", content: {} });
  const idle = n.idle ? `<div class="result"><span class="chip s-failed">idle</span><span>Lean shows doing nothing meets it (${esc(n.idle)}): it says only what must not happen. State what users can do, so it says <i>exactly</i>.</span></div>`
    : `<div class="result"><span class="chip ${n.status && n.status !== "unchecked" ? "s-proven" : "s-not-checked"}">idle</span><span>${n.status && n.status !== "unchecked" ? "Doing nothing does not meet it, as far as Lean shows." : "Not checked yet: whether doing nothing meets it."}</span></div>`;
  const impl = ri ? `<div class="result"><span class="chip ${chipClass(ri.status)}">root_impl</span><span>${ri.status === "proven" ? "Proven: the root holds of the code, from what is trusted below." : `${esc(ri.status)}${ri.detail ? ": " + esc(ri.detail) : ""}`}</span></div>` : "";
  return `${idle}${impl}
    <div class="side"><div class="label">trusted — the hypotheses of root_impl: assumptions, and claims nothing below proves yet</div>${tr.length
      ? tr.map(t => `<div class="small"><a data-goto="${esc(t.id)}"><b>${esc(t.id)}</b></a> <span class="muted">(${esc(t.kind)})</span> ${esc(C(t).statement || "")}</div>`).join("")
      : `<div class="small">Nothing: the root is proven of the code without an assumption.</div>`}</div>`;
}

// The decision: where the theory is built. The developer chooses, with a reason.
function decisionBox(n) {
  // Another knowledge base's node: decided and checked there; here its decisions are read.
  if (n.imported) return `<div class="box ${n.state === "accepted" ? "accepted" : "proposed"}"><div class="verdict ${n.state === "accepted" ? "accepted" : "proposed"}">${n.state === "accepted" ? "Accepted" : "Waiting"} in ${esc(n.imported)}</div>
    <div class="muted small">${esc(n.id)} is decided in ${esc(n.imported)}, the project it comes from; this project reads its decisions there.</div></div>`;
  const blocked = !!n.waitsFor; // from core: a proposal, or a node whose parent moved, waits for its parents and the definitions it uses
  const chosen = reasons(n);
  const gone = rejectedAlts(n);
  const altList = gone.length ? `<div class="side"><div class="label">rejected alternatives</div>${gone.map(r =>
    `<div class="option"><b>${esc(r.id)}</b> — ${esc(r.content?.statement)}<div class="muted small">${esc(r.content?.why)}</div></div>`).join("")}</div>` : "";
  // Its alternatives: one replaces the other, or both define a term. Accepting this one rejects them.
  const alts = liveAlts(n);
  const altBox = alts.length ? `<div class="side"><div class="label">${alts.length > 1 ? "alternatives" : "an alternative"} to it — accepting ${esc(n.id)} rejects ${alts.map(a => esc(a.id)).join(", ")} (kept, with your reason); to keep ${alts.length > 1 ? "one of them" : "it"} instead, accept it there</div>${alts.map(o => `<div class="option">
      <div class="head"><span class="kind ${kindOf(o)}">${esc(kindOf(o))}</span><a data-goto="${esc(o.id)}"><b>${esc(o.id)}</b></a>${chips(o)}${o.replaces === n.id ? ` <span class="muted small">replaces ${esc(n.id)}</span>` : n.replaces === o.id ? ` <span class="muted small">${esc(n.id)} replaces it</span>` : ""}</div>
      <div class="small" style="margin-top:4px">${esc(C(o).statement)}</div><div class="muted small">${esc(C(o).why)}</div>
      ${(o.defines || []).some(t => (n.defines || []).includes(t)) ? `<div class="muted tiny">both define ${esc((o.defines || []).filter(t => (n.defines || []).includes(t)).join(", "))}</div>` : ""}</div>`).join("")}</div>` : "";
  const parts = splitParts(n);
  const partsBox = parts.length ? `<div class="side"><div class="label">its ${parts.length} part${parts.length > 1 ? "s" : ""} — decided with it: do these parts make it?</div>${partsTable(n)}</div>` : "";
  const label = `Accept ${esc(n.id)}${parts.length ? `: ${parts.length > 1 ? "these parts make it" : "this part makes it"}` : ""}${alts.length ? `, rejecting ${alts.map(a => esc(a.id)).join(", ")}` : ""}`;
  const button = blocked
    ? `<div class="muted small">Accept <a data-goto="${esc(n.waitsFor)}">${esc(n.waitsFor)}</a> first: what rests on it is decided after it.</div>`
    : `<div class="actions"><button class="btn small primary" data-accept="1">${label}</button></div>`;
  const warn = warnings(n);
  if (n.state === "proposed") {
    return `<div class="box proposed"><div class="verdict proposed">${alts.some(o => o.state === "proposed") ? "Choose between the alternatives" : "Proposed"}</div>
      <div class="muted small">Choosing keeps your reason; what you reject is kept as an alternative.</div>${mechanicalNote(n)}
      ${partsBox}${rootBlock(n)}${altBox}
      ${warn.length ? `<div class="warn-text">Note: ${esc(warn.join("; "))}.</div>` : ""}
      ${aboveReasons(n)}
      ${n.code ? governedFiles(n) : ""}
      ${altList}
      ${reasonBox(parts.length ? "Why do these parts make it (and say it in the domain's words)?" : "Why this one (or why not)?", "", n)}
      ${button}<div class="actions"><button class="btn small" data-reject-self="1">Reject ${esc(n.id)}</button> ${sendBack(n)}</div></div>`;
  }
  if (n.state === "review") {
    // The decisions below that this decision acts on, from core, with their reasons: where the
    // conditions for revisiting them are written.
    const listed = n.below || [];
    const moved = listed.some(b => b.kind === "moved");
    const belowList = ((n.causes || []).includes("self") || moved) && listed.length ? `<div class="side"><div class="label">decisions below, with their reasons — tick those this change may affect: they are reviewed again. The others still hold${moved ? "; those that moved only because of this are confirmed with your reason" : ""}.</div>${listed.map(b => `<div class="option">
        <div class="head"><a data-goto="${esc(b.id)}"><b>${esc(b.id)}</b></a>${b.kind === "moved" ? ` <span class="muted small">(moved with this)</span>` : ""}</div>
        <div class="small" style="margin-top:4px">${esc(b.statement)}</div>
        <div class="muted small">holds because: ${esc(b.reason)}</div>
        ${b.chosen && b.chosen !== b.reason && !b.reason.startsWith(b.chosen) ? `<div class="muted tiny">first chosen because: ${esc(b.chosen)}</div>` : ""}
        ${b.why ? `<div class="muted tiny">why: ${esc(b.why)}</div>` : ""}
        ${conditional(b) && b.kind !== "moved"
          ? `<div class="warn-text small">It says when to revisit it: answer it.</div>
             <label><input type="radio" class="ans" name="ans-${esc(b.id)}" value="held" data-id="${esc(b.id)}"> still holds</label>
             <label><input type="radio" class="ans" name="ans-${esc(b.id)}" value="revisit" data-id="${esc(b.id)}"> revisit ${esc(b.id)}</label>`
          : `<label><input type="checkbox" class="rev" value="${esc(b.id)}" data-moved="${b.kind === "moved" ? 1 : ""}"> revisit ${esc(b.id)}</label>`}</div>`).join("")}</div>` : "";
    return `<div class="box review"><div class="verdict review">To review: ${esc((n.causes || []).map(c => causeText[c] || c).join("; "))}</div>${mechanicalNote(n)}
      ${warn.length ? `<div class="warn-text">Note: ${esc(warn.join("; "))}.</div>` : ""}
      ${chosen}${whatMoved(n)}${partsBox}${rootBlock(n)}${altBox}${aboveReasons(n)}${altList}${belowList}
      ${reasonBox((n.causes || []).includes("self") ? "Why is the change right?" : (n.causes || []).includes("parts") ? "Why do these parts still make it?" : "Why does it still hold, given what changed?", "", n)}
      ${button}<div class="actions">${sendBack(n)}</div></div>`;
  }
  return `<div class="box accepted"><div class="verdict accepted">Accepted</div>
    ${chosen}${altList}</div>`;
}

// What Lean computes of one example, against what Scala computes.
function leanBadge(l, prefix) {
  if (!l) return "";
  if (l.status === "proven") return `<div class="lean"><span class="chip s-ok" title="${esc(l.detail)}">${prefix}Lean agrees</span></div>`;
  if (l.status === "failed") return `<div class="lean bad"><span class="chip s-bad">✗ ${prefix}Lean disagrees</span>${l.detail ? `<div class="small">${esc(l.detail)}</div>` : ""}</div>`;
  return `<div class="lean"><span class="chip s-not-checked" title="${esc(l.detail)}">${prefix}${l.status === "unevaluated" ? "not evaluated in Lean" : "not checked in Lean"}</span></div>`;
}

function examplesTable(n) {
  const limits = n.limits || [];
  const lim = limits.length ? `<div class="limits"><b>Does not promise:</b><ul style="margin:4px 0 0 18px;padding:0">${limits.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>` : "";
  if (!(n.examples || []).length) return lim ? `<h3>Limits</h3>${lim}` : "";
  const res = (r, expected) => r === "ok" ? `<span class="chip s-ok">${expected ? "allows ✓" : "refuses ✓"}</span>` : r ? `<span class="chip s-bad">${esc(r)}</span>` : `<span class="muted small">—</span>`;
  let rows = "", given = null;
  for (const e of n.examples) {
    const g = e.given.join(", ");
    if (g !== given) { given = g; rows += `<tr><td colspan="4" class="mono muted small" style="padding-top:10px">given ${esc(g)}</td></tr>`; }
    rows += `<tr${leanFailed(e) ? ` class="lean-failed"` : ""}><td><span class="chip ${(e.note || "").startsWith("generated") ? "s-not-checked" : e.expected ? "s-ok" : "s-not-checked"}">${(e.note || "").startsWith("generated") ? "generated" : e.expected ? "expect" : "reject"}</span></td>
      <td>${esc(e.note)}<div class="mono muted">${esc(e.call)}</div>${leanBadge(e.lean, "")}${leanBadge(e.leanImplementation, "implementation: ")}</td>
      <td>${res(e.contract, e.expected)}</td><td>${e.expected ? (e.implementation === "ok" ? `<span class="chip s-ok">returns it ✓</span>` : res(e.implementation, true)) : `<span class="muted small">—</span>`}</td></tr>`;
  }
  const lf = n.examples.filter(leanFailed).length;
  return `<h3>Examples</h3><div class="muted small">What this contract means in concrete cases, checked against the contract and against the implementation, and evaluated in Lean on the same values.</div>
    ${lf ? `<div class="box failed"><div class="verdict failed">Lean disagrees with Scala on ${lf} example${lf > 1 ? "s" : ""}</div><div class="small">Lean, evaluating the example on its concrete values, computes something else than Scala does: the translation to Lean is wrong, so nothing proven of this node can be trusted until it is fixed.</div></div>` : ""}
    <table><tr><th></th><th>case</th><th>contract</th><th>implementation</th></tr>${rows}</table>${lim}`;
}

function requestsFor(node) {
  const rs = requests().filter(r => r.node === node && r.status !== "closed");
  return rs.map(r => `<div class="req"><div class="small"><b>${esc(r.by)}</b> <span class="muted">${new Date(r.at).toLocaleString()} · ${esc(r.status)}</span></div>
    <div>${esc(r.text)}</div>
    ${r.answer ? `<div class="answer small"><span class="muted">agent:</span> ${esc(r.answer)}</div>` : ""}
    ${r.status === "answered" ? `<div class="actions"><button class="btn small" data-close="${esc(r.id)}">Done</button></div>` : ""}</div>`).join("");
}

function askBox(node, placeholder) {
  return `<textarea id="ask" rows="2" placeholder="${esc(placeholder)}"></textarea>
    <div class="actions"><button class="btn small" data-ask="${esc(node)}">Send to the agent</button>
    <span class="muted small">The agent sees it in its inbox and answers with proposals.</span></div>`;
}

// Its parents: it is a part of each. With each parent's split, whether it is needed there, and its co-parts.
function parentsSection(n) {
  const ps = parentsOf(n).map(byId);
  if (isDef(n)) {
    const users = usersOf(n);
    return `<h3>Used by</h3>${users.length ? users.map(u => `<div class="small"><span class="kind ${kindOf(u)}">${esc(kindOf(u))}</span> <a data-goto="${esc(u.id)}"><b>${esc(u.id)}</b></a> ${esc(C(u).statement)}</div>`).join("")
      : `<div class="muted small">No node uses it yet.</div>`}<div class="muted small" style="margin-top:4px">A definition has no parents: its place is where the terms it fixes are used. A change to it puts those nodes up for review.</div>`;
  }
  if (!ps.length) {
    if (isRoot(n)) return `<h3>Parents</h3><div class="muted small">None: it is the root, the idea's purpose. Every other node refines it.</div>`;
    const callers = live().filter(c => (c.relies || []).includes(n.id));
    return `<h3>Parents</h3><div class="muted small">None${callers.length ? `: code calls its operation (${callers.map(c => `<a data-goto="${esc(c.id)}">${esc(c.id)}</a>`).join(", ")})` : n.imported ? `: it comes from ${esc(n.imported)}` : ""}.</div>`;
  }
  return `<h3>Parents — it is a part of ${ps.length > 1 ? `each of these ${ps.length}` : "it"}</h3>` + ps.map(p => {
    const need = (p.split?.needed || []).find(x => x.id === n.id);
    const co = splitParts(p).filter(id => id !== n.id && !(byId(id) && alternative(n, byId(id))));
    return `<div class="option"><div class="head"><span class="kind ${kindOf(p)}">${esc(kindOf(p))}</span><a data-goto="${esc(p.id)}"><b>${esc(p.id)}</b></a>
        <span class="chip s-${p.state}">${esc(p.state)}</span>${splitChip(p)}${need ? neededChip(need) : ""}</div>
      <div class="small" style="margin-top:4px">${esc(C(p).statement)}</div>
      ${n.kind === "design" ? `<div class="muted tiny">it governs code of ${esc(p.id)} no proof covers</div>`
        : `<div class="muted tiny">${co.length ? `with ${co.map(x => `<a data-goto="${esc(x)}">${esc(x)}</a>`).join(", ")}, together they make it` : "its only part"}${need?.status === "open" && need.detail ? ` — not needed: ${esc(need.detail)}` : ""}</div>`}</div>`;
  }).join("");
}

// The terms it mentions, with their meanings and the definition that fixes each (if one does).
function vocabularyOf(n) {
  const terms = [...(snap()?.opaques || []), ...(snap()?.params || [])];
  const rows = (C(n).vocabulary || []).map(v => { const i = v.indexOf(":"); const name = i < 0 ? v : v.slice(0, i).trim(), means = i < 0 ? "" : v.slice(i + 1).trim();
    const t = terms.find(x => x.name === name);
    return `<tr><td class="mono">${esc(name)}${t?.operation ? ` <span class="muted tiny">operation</span>` : ""}</td><td>${esc(means)}</td><td>${t?.definedBy ? `<a data-goto="${esc(t.definedBy)}">${esc(t.definedBy)}</a>` : `<span class="muted small">open</span>`}</td></tr>`; }).join("");
  const defs = usesOf(n);
  return (rows ? `<div class="side"><div class="label">the vocabulary it uses</div><table><tr><th>term</th><th>means</th><th>defined by</th></tr>${rows}</table></div>` : "") +
    (defs.length ? `<div class="side"><div class="label">definitions in force it uses</div>${defs.map(d => `<div class="small"><a data-goto="${esc(d.id)}"><b>${esc(d.id)}</b></a> <span class="chip s-${d.state}">${esc(d.state)}</span> ${esc(C(d).statement)} <span class="muted">— fixes ${esc((d.defines || []).join(", "))}</span></div>`).join("")}</div>` : "");
}

// The node itself, by kind: what it says formally, and what it governs or keeps.
function nodeSection(n) {
  const c = C(n), k = kindOf(n);
  const tail = () => `${vocabularyOf(n)}
    ${n.code ? `<div class="side"><div class="label">governs</div><div class="mono small">${esc(n.code.files.join(", "))}</div></div>` : ""}
    ${(n.expectations || []).map(e => `<div class="side"><div class="label">expected of it — ${esc(e.status)}${e.detail ? ": " + esc(e.detail) : ""}</div>
      <div class="small">${esc(e.statement)}</div><pre>${esc(e.source)}</pre></div>`).join("")}
    ${(n.relies || []).length ? `<div class="side"><div class="label">its code calls</div>${n.relies.map(id => `<div class="small"><a data-goto="${esc(id)}"><b>${esc(id)}</b></a> ${esc(C(byId(id) || {}).statement || "")}</div>`).join("")}<div class="muted tiny">proven from their promises alone, not from their code</div></div>` : ""}
    ${(() => { const by = live().filter(x => (x.relies || []).includes(n.id)); return by.length ? `<div class="side"><div class="label">called by the code of</div><div class="small">${by.map(x => `<a data-goto="${esc(x.id)}">${esc(x.id)}</a>`).join(", ")}: a change to what this node means puts them up for review</div></div>` : ""; })()}
    ${n.proof ? `<details ${n.state !== "accepted" ? "open" : ""}><summary>authored proof — ${esc(n.proof.file)}</summary><pre>${esc(n.proof.source)}</pre></details>` : ""}`;
  if (n.kind === "design")
    return `<h3>Design decision</h3><div class="box"><div class="muted small">No formal model: decided and tracked like the rest, and every change to the files it governs is yours to review:</div>
      <pre>${esc((n.code?.files || []).join("\n") || "—")}</pre></div>`;
  if (isDef(n)) {
    const terms = [...(snap()?.opaques || []), ...(snap()?.params || [])];
    return `<h3>Definition — decided, not proven</h3><div class="box"><div class="muted small">It fixes terms of the vocabulary: every node that mentions them is checked with this meaning.</div>
      <table style="margin-top:6px"><tr><th>term</th><th>means</th><th>is now</th></tr>${(n.defines || []).map(t => { const x = terms.find(y => y.name === t);
        const sub = (c.substitutions || []).find(v => v.startsWith(t + " :=") || v.startsWith(t + " ="));
        return `<tr><td class="mono">${esc(t)}</td><td>${esc(x?.means || "")}</td><td class="mono small">${esc(sub ? sub.slice(sub.indexOf("=") + 1).trim() : "")}</td></tr>`; }).join("")}</table>
      ${(c.uses || []).length ? `<div class="side"><div class="label">types it uses</div><pre>${esc(c.uses.join("\n"))}</pre></div>` : ""}
      ${c.definition ? `<details><summary class="small">as written</summary><pre>${esc(c.definition)}</pre></details>` : ""}</div>`;
  }
  if (k === "invariant")
    return `<h3>Invariant</h3><div class="box"><div class="muted small">One rule, stated once. Every contract in its scope keeps it, listing the pairs a call exposes to the rule (proven from the contract's post in Lean, and checked on its examples and at run time), or says why it does not apply. The contracts that keep it are its parts.</div>
      ${sourcesOf(n)}
      ${(n.covers || []).map(id => { const kp = (byId(id)?.invariants || []).find(i => i.id === n.id) || {};
        return `<div class="side"><div class="label">kept by <a data-goto="${esc(id)}">${esc(id)}</a> — ${esc(kp.status || "")}${kp.detail ? ": " + esc(kp.detail) : ""}</div><pre>${esc(kp.view || "")}</pre></div>`; }).join("")}
      ${(n.exempts || []).map(id => { const kp = (byId(id)?.invariants || []).find(i => i.id === n.id) || {};
        return `<div class="side"><div class="label"><a data-goto="${esc(id)}">${esc(id)}</a> is exempt</div><div class="small">${esc(kp.detail || "")}</div></div>`; }).join("")}
      ${tail()}</div>`;
  const head = {
    root: ["The root — the idea's purpose", "Stated as <i>exactly</i>: what users can do and what must never happen, together. Every node below is proven to imply it."],
    claim: ["Claim", "A property over the vocabulary, in one sentence. Its parts, together, are proven to make it."],
    contract: [`Contract on <span class="mono">${esc(n.op || "")}</span>`, "Every call of the operation meets its post. Proven of its code where the code is a define; checked on its examples and at run time otherwise."],
    assumption: ["Assumption — trusted, not proven", "What the outside does (a port), or a fact of the world. It is a hypothesis of root_impl: listed among what the root rests on."],
  }[k] || [esc(k), ""];
  return `<h3>${head[0]}</h3><div class="box"><div class="muted small">${head[1]}</div>
    ${sourcesOf(n)}
    ${n.kind === "contract" ? `<div class="side"><div class="label">implementation</div><div class="small">${n.implementationProof
      ? `${esc(n.implementationProof.name)}: ${esc(n.implementationProof.status)}${leanText(n.implementationProof.detail)}`
      : C(n).implementation ? `plain Scala, checked on its ${(n.examples || []).length} examples, every combination of their inputs, and at run time by service: not proven` : "none registered"}</div>
      ${C(n).implementation ? `<details><summary class="small">the code</summary><pre>${esc(C(n).implementation)}</pre></details>` : ""}</div>` : ""}
    ${(n.invariants || []).map(i => i.status === "exempt"
      ? `<div class="side"><div class="label">exempt from <a data-goto="${esc(i.id)}">${esc(i.id)}</a></div><div class="small">${esc(i.detail)}</div></div>`
      : `<div class="side"><div class="label">keeps <a data-goto="${esc(i.id)}">${esc(i.id)}</a> — ${esc(i.status)}${i.detail ? ": " + esc(i.detail) : ""}</div>
        <div class="muted small">the pairs a call shows to the rule:</div><pre>${esc(i.view)}</pre><div class="muted small">the rule:</div><pre>${esc(i.rule)}</pre></div>`).join("")}
    ${n.leaf ? `<div class="warn-text">Nothing below proves it yet: it is trusted as it stands (a hypothesis of root_impl). Add the parts that make it, or a contract.</div>` : ""}
    ${tail()}</div>`;
}

// Its parts, when they are not already in the decision above.
function partsSection(n) {
  const designs = treeChildren(n.id).filter(c => c.kind === "design");
  const h = splitParts(n).length ? `<h3>Parts — together they make it</h3>${partsTable(n)}` : "";
  const r = isRoot(n) ? `<h3>The root, of the code</h3>${rootBlock(n)}` : "";
  return h + r + (designs.length ? `<h3>Design decisions under it</h3>${designs.map(d => `<div class="small"><a data-goto="${esc(d.id)}"><b>${esc(d.id)}</b></a> ${esc(C(d).statement)}</div>`).join("")}` : "");
}

function nodePane() {
  const n = byId(state.selected);
  if (!n) return `<p class="muted">Select a node.</p>`;
  const c = C(n), k = kindOf(n);
  let h = `<div style="display:flex;align-items:center;gap:8px"><span class="kind ${k}">${esc(k)}</span><h2>${esc(n.id)}</h2></div>
    <div class="chips" style="margin-top:6px">${chips(n)}${n.replaces ? `<span class="chip s-not-checked">replaces ${esc(n.replaces)}</span>` : ""}</div>
    <p class="lead">${esc(c.statement)}</p>
    <div class="why"><div class="label">why</div>${esc(c.why)}</div>
    ${needsYou(n) ? `<h3>Decision</h3>${decisionBox(n)}` : ""}`;
  // Under review, what changed is in the decision above: the rest of the node is there to look up.
  const folded = n.state === "review";
  // Its parents always: what it is a part of is what a decision on it is about.
  h += parentsSection(n);
  if (folded) h += `<details class="full"><summary>The node in full: its model, examples and parts</summary>`;
  h += nodeSection(n);
  // The parts are in the decision while it waits for you; below the node otherwise.
  if (!needsYou(n)) h += partsSection(n);
  else { const designs = treeChildren(n.id).filter(x => x.kind === "design"); if (designs.length) h += `<h3>Design decisions under it</h3>${designs.map(d => `<div class="small"><a data-goto="${esc(d.id)}"><b>${esc(d.id)}</b></a> ${esc(C(d).statement)}</div>`).join("")}`; }
  h += examplesTable(n);
  if (folded) h += `</details>`;
  if (!needsYou(n)) h += `<h3>Decision</h3>${decisionBox(n)}`;
  if (n.messages?.length) h += `<h3>Messages</h3><pre>${esc(n.messages.join("\n\n"))}</pre>`;
  const openProof = ["open", "failed"].includes(n.split?.complete?.status) || n.implementationProof?.status === "open" || n.rootImpl?.status === "open";
  h += `<h3>Ask the agent</h3>${requestsFor(n.id)}
    ${askBox(n.id, n.kind === "contract" ? "e.g. Add an example: a revoked grant refuses access." : isDef(n) ? "e.g. Propose another definition: sessions expire after an hour." : "e.g. Propose the parts that make it: tokens expire after an hour.")}
    <div class="actions">
      ${n.kind !== "design" && !isDef(n) ? `<button class="btn small" data-run="check" data-arg="${esc(n.id)}">Check this node</button>` : ""}
      ${openProof && !n.proof && (n.obligations || []).length ? `<button class="btn small" data-run="scaffold" data-arg="${esc(n.id)}">Create proof file</button>` : ""}
    </div>`;
  if (n.holds) h += `<details><summary>Theorem holds — ${esc(n.id)} from the leaves below it (contracts, assumptions, claims with no parts)</summary><pre>${esc(n.holds)}</pre></details>`;
  if ((n.obligations || []).length) h += `<details><summary>Obligations in Lean (${n.obligations.length})</summary>${n.obligations.map(o =>
    `<div class="side"><div class="label"><b>${esc(o.name)}</b>${o.description ? ` — ${esc(o.description)}` : ""}</div><pre>${esc(o.statement)}</pre></div>`).join("")}</details>`;
  if (n.lean) h += `<details><summary>Generated Lean</summary><pre>${esc(n.lean)}</pre></details>`;
  return h;
}

// Nodes decided at once with one reason: one accept each, parents first (each with the version seen).
function batchBox(ns, title, note, placeholder) {
  // In the order core gives: each after what it rests on (its parents, the definitions it uses, what its code calls).
  const at = n => { const i = rank(n); return i < 1e9 ? i : 1e9 + depth(n); };
  const ids = [...ns].sort((a, b) => at(a) - at(b)).map(n => n.id).join(",");
  return `<div class="box review" style="margin-top:0"><div class="verdict review">${title}</div>
    <div class="small">${ns.map(n => `<a data-goto="${esc(n.id)}">${esc(n.id)}</a>`).join(", ")} — ${note}</div>
    <textarea data-batchreason="${esc(ids)}" rows="1" placeholder="${esc(placeholder)}"></textarea>
    <div class="actions"><button class="btn small" data-batch="${esc(ids)}">${ns.length > 1 ? `Accept all ${ns.length}` : `Accept ${esc(ns[0].id)}`}</button></div></div>`;
}

// A review caused only by an ancestor's change that is itself waiting is decided with it: grouped under it.
function followers(n, w) {
  if ((n.causes || []).join() !== "above") return null;
  const m = (n.moved || []).map(x => x.id).find(id => w.some(x => x.id === id));
  return m || null;
}

function inboxPane() {
  const waiting = waitingForYou(), w = waiting.filter(n => !n.mechanical), mech = waiting.filter(n => n.mechanical);
  const ready = w.filter(n => !waitsOn(n)), later = w.filter(n => waitsOn(n));
  // One line per node: its chips, and what makes it ready or not.
  const row = (n, all) => `<div class="req"><span class="kind ${kindOf(n)}">${esc(kindOf(n))}</span> <a data-goto="${esc(n.id)}"><b>${esc(n.id)}</b></a> ${chips(n)}
      ${parentsOf(n).length > 1 ? `<span class="chip s-not-checked" title="a part of ${esc(parentsOf(n).join(", "))}">${parentsOf(n).length} parents</span>` : ""}
      ${splitParts(n).length ? `<span class="chip s-not-checked">${splitParts(n).length} part${splitParts(n).length > 1 ? "s" : ""}</span>${splitChip(n)}` : ""}
      <div class="small">${esc(C(n).statement)}</div>
      ${waitsOn(n) ? `<div class="muted tiny">after <a data-goto="${esc(waitsOn(n))}">${esc(waitsOn(n))}</a>: what it rests on is decided first</div>` : ""}
      ${all.filter(f => followers(f, all) === n.id).map(f => `<div class="muted small">↳ <a data-goto="${esc(f.id)}">${esc(f.id)}</a> moved with it: decided together, from its review</div>`).join("")}</div>`;
  const answered = requests().filter(r => r.status === "answered");
  const open = requests().filter(r => r.status === "open");
  const rejected = all().filter(n => n.state === "rejected");
  const warns = snap()?.warnings || [];
  return `${warns.length ? `<div class="box failed" style="margin-top:0"><div class="verdict failed">Warnings</div>${warns.map(x => `<div class="small">${esc(x)}</div>`).join("")}</div>` : ""}
    ${(snap()?.unsigned || []).length ? `<div class="box review" style="margin-top:0"><div class="verdict review">Decisions not signed by your key</div>
      <div class="muted small">Each decision you make here is signed with your key; these are not. One you did not make was written into the ledger by someone else: decide that node again. Sign only the ones that are yours.</div>
      ${snap().unsigned.map(u => `<label class="small" style="display:block"><input type="checkbox" class="unsigned" value="${esc(u.entry)}"> <a data-goto="${esc(u.node)}">${esc(u.node)}</a>: ${esc(u.action)} by ${esc(u.by)}, ${new Date(u.at).toLocaleString()} — ${esc(u.reason)}</label>`).join("")}
      <div class="actions"><button class="btn small" data-sign="1">These are mine: sign them</button></div></div>` : ""}
    <h3 style="margin-top:0">Waiting for you — ready: everything above it is decided</h3>${ready.length ? ready.filter(n => !followers(n, w)).map(n => row(n, w)).join("")
      : gone().length || mech.length || later.length ? `<div class="muted small">None ready.</div>` : `<div class="muted small">Nothing. Every node is accepted.</div>`}
    ${mech.length ? `<h3>Mechanical — Lean proves these again; nothing in them is a choice</h3>
      ${batchBox(mech, `${mech.length} mechanical decision${mech.length > 1 ? "s" : ""}`, "nothing you decided in them changed (only the types they use, a proven implementation, or something above them), and Lean proves them again. Open one to read what moved.", "Why do they hold? e.g. a new field no rule reads")}` : ""}
    ${later.length ? `<h3>After the decisions above them</h3>${later.filter(n => !followers(n, w)).map(n => row(n, w)).join("")}` : ""}
    ${gone().map(r => `<div class="req"><b>${esc(r.id)}</b> <span class="chip s-review">gone from the model</span>
      <div class="small">${esc(r.decision?.content?.statement)}</div>
      ${(r.renamedTo || []).length ? `<div class="small">Says what ${(r.renamedTo).map(x => `<a data-goto="${esc(x)}">${esc(x)}</a>`).join(", ")} says, under another name: if it was renamed, its history (its choice, reasons, rejected alternatives) carries over.</div>` : ""}
      <textarea class="removal" data-node="${esc(r.id)}" rows="1" placeholder="Why is it gone, or why renamed?"></textarea>
      <div class="actions"><button class="btn small primary" data-gone="${esc(r.id)}">Accept that it is gone</button>
        ${(r.renamedTo || []).map(x => `<button class="btn small" data-rename="${esc(x)}" data-from="${esc(r.id)}">Renamed to ${esc(x)}</button>`).join("")}</div></div>`).join("")}
    ${(() => { const others = waitingAll().filter(n => !yours(n)); if (!others.length) return "";
      const by = {}; others.forEach(n => { const k = n.imported ? `${n.imported} (another project)` : n.owner; (by[k] = by[k] || []).push(n); });
      return `<h3>Waiting for other owners</h3>${Object.entries(by).map(([o, ns]) => `<div class="small"><b>${esc(o)}</b>: ${ns.map(n => `<a data-goto="${esc(n.id)}">${esc(n.id)}</a>`).join(", ")}</div>`).join("")}`; })()}
    <h3>Answered by the agent</h3>${answered.length ? answered.map(r => `<div class="req"><div class="small">on ${r.node ? `<a data-goto="${esc(r.node)}">${esc(r.node)}</a>` : "the idea"}</div>
      <div>${esc(r.text)}</div><div class="answer small"><span class="muted">agent:</span> ${esc(r.answer)}</div>
      <div class="actions"><button class="btn small" data-close="${esc(r.id)}">Done</button></div></div>`).join("") : `<div class="muted small">None.</div>`}
    <h3>Waiting for the agent</h3>${open.length ? open.map(r => `<div class="req"><div class="small">on ${r.node ? `<a data-goto="${esc(r.node)}">${esc(r.node)}</a>` : "the idea"} · ${esc(r.by)}</div><div>${esc(r.text)}</div></div>`).join("") : `<div class="muted small">None.</div>`}
    ${rejected.length ? `<div class="muted small" style="margin-top:8px">${rejected.length} rejected node(s) still in the Scala model; the agent removes them.</div>` : ""}
    <h3>Ask about the whole idea</h3>${askBox("", "e.g. Users can also see who accessed their records: propose where it belongs.")}`;
}

function markdown(src) {
  const out = []; let list = null, para = [], fence = null;
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  const flush = () => { if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`); para = []; if (list) { out.push(`<ul>${list.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); list = null; } };
  for (const line of src.split("\n")) {
    if (fence !== null) { if (line.startsWith("```")) { out.push(`<pre>${esc(fence.join("\n"))}</pre>`); fence = null; } else fence.push(line); continue; }
    if (line.startsWith("```")) { flush(); fence = []; continue; }
    const hd = line.match(/^(#{1,4})\s+(.*)/), li = line.match(/^\s*[-*]\s+(.*)/);
    if (hd) { flush(); out.push(`<h${hd[1].length}>${inline(hd[2])}</h${hd[1].length}>`); }
    else if (li) { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } (list ||= []).push(li[1]); }
    else if (!line.trim()) flush();
    // A line under a list item (indented, or lazily not) continues that item.
    else if (list && !para.length) list[list.length - 1] += " " + line.trim();
    else para.push(line.trim());
  }
  flush();
  return out.join("");
}

function ideaPane() {
  const s = snap();
  if (state.editingIdea) return `<div class="muted small">IDEA.md. Its title and lead paragraph are the root: a change puts the root (or the nodes naming a changed section) up for review. When you accept it, tick the decisions below whose reasons the change may affect: they are reviewed again.</div>
    <textarea id="ideaText" rows="22" class="mono">${esc(state.ideaDraft ?? state.ideaBase ?? "")}</textarea>
    ${state.ideaError ? `<div class="err-text">${esc(state.ideaError)}</div>` : ""}
    <div class="actions"><button class="btn small primary" id="saveIdea">Save</button><button class="btn small" id="cancelIdea">Cancel</button></div>`;
  const root = byId(s?.root);
  return `<div class="actions" style="margin-top:0"><span class="muted small">The root, the idea's purpose: ${root ? `<a data-goto="${esc(root.id)}">${esc(root.id)}</a>` : "none yet"}</span>
      <span class="spacer"></span><button class="btn small" id="editIdea">Edit</button></div>
    <div class="md">${markdown(s?.idea || "*No idea file.*")}</div>
    <div class="muted small">List what the tree deliberately leaves out under “## Not modelled”, so the limits of the theory are explicit.</div>`;
}

function vocabularyPane() {
  const s = snap();
  const by = t => t.definedBy ? `<a data-goto="${esc(t.definedBy)}">${esc(t.definedBy)}</a>` : `<span class="muted small">open</span>`;
  const defs = live().filter(isDef);
  return `<h3 style="margin-top:0">Vocabulary</h3><div class="muted small">The terms of the model and what they mean in the world: the project's ubiquitous language. An open term is anything that meets what is proven; a definition fixes it. A change to a meaning puts the nodes that use the term up for review.</div>
    <table><tr><th>term</th><th>means</th><th>Lean type</th><th>defined by</th></tr>
    ${(s.opaques || []).map(o => `<tr><td class="mono">${esc(o.name)}</td><td>${esc(o.means)}</td><td class="mono muted">Type</td><td>${by(o)}</td></tr>`).join("")}
    ${(s.params || []).map(p => `<tr><td class="mono">${esc(p.name)}${p.operation ? ` <span class="muted tiny">operation</span>` : ""}</td><td>${esc(p.means)}</td><td class="mono muted">${esc(p.type)}</td><td>${by(p)}</td></tr>`).join("")}</table>
    <h3>Definitions</h3>${defs.map(d => `<div class="small" style="margin-top:4px"><a data-goto="${esc(d.id)}"><b>${esc(d.id)}</b></a> <span class="chip s-${d.state}">${esc(d.state)}</span> fixes ${esc((d.defines || []).join(", "))}: ${esc(C(d).statement)}</div>`).join("") || "<span class='muted'>none</span>"}
    <h3>Domain types</h3>${(s.types || []).map(t => `<pre>${esc(t.lean)}</pre>`).join("") || "<span class='muted'>none</span>"}
    <h3>Functions (define)</h3>${(s.defs || []).map(d => `<div class="side"><div class="label"><b>${esc(d.name)}</b></div><pre>${esc(d.source)}</pre></div>`).join("") || "<span class='muted'>none</span>"}`;
}

function historyPane() {
  const hs = state.history || [];

  return hs.length ? `<div class="muted small">Every decision, from the ledger (committed with the code).</div>` + hs.map(e =>
    `<div class="event"><span class="d ${esc(e.action)}"></span><div><a data-goto="${esc(e.node)}"><b>${esc(e.node)}</b></a> ${esc(VERB[e.action] || e.action)} by ${esc(e.by)}${(e.rejected || []).length ? `, rejecting ${esc(e.rejected.join(", "))}` : ""}
      <div class="small">${esc(e.reason)}</div><div class="when">${new Date(e.at).toLocaleString()}</div></div></div>`).join("") : `<p class="muted">No decisions yet.</p>`;
}

// --- actions ----------------------------------------------------------------

async function run(args, el) {
  const gen = state.gen;
  try { const job = await post(`${P()}/run`, { args }); if (!current(gen)) return; state.jobOpen = true; state.job = job; render(); } catch (e) { say(el, e.message); }
}

function needName(el) {
  if (me()) return me();
  $("#me").focus(); say(el, "Enter your name at the top right: it is recorded with your decisions and requests.");
  return null;
}

// An error, said where it happened: under the button that was pressed (no dialog).
function say(el, msg, cls = "err-text") {
  const at = el?.closest(".actions") || el?.parentElement;
  if (!at) { alert(msg); return; }
  let m = at.querySelector(":scope > .said");
  if (!m) { m = document.createElement("div"); at.appendChild(m); }
  m.className = `said ${cls}`; m.style.flexBasis = "100%"; m.textContent = msg;
}
const words = s => (s || "").split(/\s+/).filter(w => /\p{L}/u.test(w)).length;

// A refusal is kept above the node, so a redraw cannot hide it.
async function decide(body, el) {
  try { await post(`${P()}/decide`, body); state.notice = null; await refresh(); }
  catch (e) { state.notice = { node: body.node, msg: e.message }; await refresh(); }
}

document.addEventListener("click", async e => {
  const t = e.target;
  const go = t.closest("[data-goto]");
  if (go) { e.preventDefault(); state.selected = go.dataset.goto; state.tab = "node"; render(); return; }
  const card = t.closest(".card");
  if (card) { state.selected = card.dataset.node; state.tab = "node"; render(); return; }
  const r = t.closest("[data-run]");
  if (r) { run([r.dataset.run, ...(r.dataset.arg ? [r.dataset.arg] : [])], r); return; }
  const tab = t.closest(".tab");
  if (tab) { state.tab = tab.dataset.tab; renderPane(); return; }
  const acc = t.closest("[data-accept]");
  if (acc) {
    const who = needName(acc); if (!who) return;
    const reason = $("#reason")?.value.trim() || "";
    if (words(reason) < 3) { $("#reason")?.focus(); say(acc, "Give your reason in a few words: it is kept as part of the theory."); return; }
    const n = byId(state.selected);
    // Accepting a node rejects its alternatives (what replaces it, what it replaces, another definition of a term it defines).
    const reject = liveAlts(n).map(x => x.id);
    const answers = [...document.querySelectorAll(".ans:checked")];
    const unanswered = [...new Set([...document.querySelectorAll(".ans")].map(x => x.dataset.id))].filter(id => !answers.some(a => a.dataset.id === id));
    if (unanswered.length) { say(acc, `Say for ${unanswered.join(", ")} whether it still holds or is revisited: its reason says when to revisit it.`); return; }
    const revisit = [...document.querySelectorAll(".rev:checked")].map(x => x.value).concat(answers.filter(a => a.value === "revisit").map(a => a.dataset.id));
    const held = answers.filter(a => a.value === "held").map(a => a.dataset.id);
    const confirmBelow = [...document.querySelectorAll(".rev:not(:checked)")].filter(x => x.dataset.moved).map(x => x.value);
    // What needs saying yes to explicitly: accepting despite a warning, and leaving every decision
    // below as it is (a choice too). Asked in place: the button turns into "Confirm: …"; a second click decides.
    const warn = warnings(n), listedBelow = document.querySelectorAll(".rev").length;
    const decided = liveAlts(n).filter(x => x.state !== "proposed").map(x => x.id);
    const ask = [warn.length ? `accept although ${warn.join("; ")}` : "",
      decided.length ? `reject ${decided.join(", ")}, which you decided before` : "",
      listedBelow && !revisit.length && !held.length ? `none of the ${listedBelow} decision(s) below is affected: their reasons still hold` : ""].filter(Boolean);
    const key = JSON.stringify([n.version, ask]);
    if (ask.length && acc.dataset.armed !== key) {
      acc.dataset.armed = key;
      if (!acc.dataset.label) acc.dataset.label = acc.textContent;
      acc.textContent = `Confirm: ${ask.length > 1 ? "all of it" : warn.length ? "accept anyway" : decided.length ? "reject it" : "none affected"}`;
      say(acc, `${n.id}: ${ask.join("; and ")}. Click “${acc.textContent}” to decide, or change your ticks.`, "confirm-text");
      return;
    }
    decide({ node: n.id, by: who, reason, reject, revisit, confirm: confirmBelow, held, seen: n.version }, acc);
    return;
  }
  const rs = t.closest("[data-reject-self]");
  if (rs) {
    const who = needName(rs); if (!who) return;
    const reason = $("#reason")?.value.trim() || "";
    if (words(reason) < 3) { $("#reason")?.focus(); say(rs, "Say why not, in a few words: it is kept as part of the theory."); return; }
    decide({ node: state.selected, by: who, reason, action: "reject", seen: byId(state.selected).version }, rs);
    return;
  }
  const sb = t.closest("[data-sendback]");
  if (sb) {
    const who = needName(sb); if (!who) return;
    const text = $("#reason")?.value.trim() || "";
    if (words(text) < 3) { $("#reason")?.focus(); say(sb, "Say what to change, in a few words, in the reason box."); return; }
    try { await post(`${P()}/requests`, { node: sb.dataset.sendback, text, by: who }); if ($("#reason")) $("#reason").value = ""; await refresh(); } catch (err) { say(sb, err.message); }
    return;
  }
  const ba = t.closest("[data-batch]");
  if (ba) {
    const who = needName(ba); if (!who) return;
    const ids = ba.dataset.batch.split(","), gen = state.gen, base = P();
    const reason = [...document.querySelectorAll("textarea[data-batchreason]")].find(x => x.dataset.batchreason === ba.dataset.batch)?.value.trim() || "";
    if (words(reason) < 3) { say(ba, "Say why they hold, in a few words."); return; }
    ba.disabled = true;
    // One request, parents first, each with the version seen: all accepted, or none.
    const nodes = ids.map(id => ({ node: id, seen: byId(id)?.version || "" }));
    try { if (current(gen)) await post(`${base}/decide`, { node: ids[0], nodes, by: who, reason }); }
    catch (err) { await refresh(); say(document.querySelector(`[data-batch="${CSS.escape(ba.dataset.batch)}"]`) || ba, err.message); return; }
    await refresh();
    return;
  }
  const sg = t.closest("[data-sign]");
  if (sg) {
    const entries = [...document.querySelectorAll(".unsigned:checked")].map(x => x.value);
    if (!entries.length) { say(sg, "Tick the decisions that are yours."); return; }
    try { await post(`${P()}/sign`, { entries }); await refresh(); } catch (err) { say(sg, err.message); }
    return;
  }
  const rn = t.closest("[data-rename]");
  if (rn) {
    const who = needName(rn); if (!who) return;
    const reason = [...document.querySelectorAll(".removal[data-node]")].find(x => x.dataset.node === rn.dataset.from)?.value.trim();
    if (words(reason) < 3) { say(rn, "Say why it was renamed, in a few words."); return; }
    const x = byId(rn.dataset.rename);
    decide({ node: rn.dataset.rename, from: rn.dataset.from, by: who, reason, action: "rename", seen: x?.version || "" }, rn);
    return;
  }
  const gn = t.closest("[data-gone]");
  if (gn) {
    const who = needName(gn); if (!who) return;
    const reason = [...document.querySelectorAll(".removal[data-node]")].find(x => x.dataset.node === gn.dataset.gone)?.value.trim();
    if (words(reason) < 3) { say(gn, "Say why it is gone, in a few words."); return; }
    decide({ node: gn.dataset.gone, by: who, reason, seen: "gone" }, gn);
    return;
  }
  const ask = t.closest("[data-ask]");
  if (ask) {
    const who = needName(ask); if (!who) return;
    const text = $("#ask").value.trim(); if (!text) { $("#ask").focus(); return; }
    try { await post(`${P()}/requests`, { node: ask.dataset.ask, text, by: who }); $("#ask").value = ""; refresh(); } catch (err) { say(ask, err.message); }
    return;
  }
  const close = t.closest("[data-close]");
  if (close) { try { await post(`${P()}/requests/${encodeURIComponent(close.dataset.close)}`, { status: "closed" }); refresh(); } catch (err) { say(close, err.message); } return; }
  // The editor remembers the text it started from: a save over a file that changed since is refused,
  // and the developer's text stays in the editor.
  if (t.id === "editIdea") { Object.assign(state, { editingIdea: true, ideaBase: state.data?.ideaNow ?? snap()?.idea ?? "", ideaDraft: null, ideaError: "" }); renderPane(); return; }
  if (t.id === "cancelIdea") { Object.assign(state, { editingIdea: false, ideaBase: null, ideaDraft: null, ideaError: "" }); renderPane(); return; }
  if (t.id === "saveIdea") {
    const gen = state.gen, text = $("#ideaText").value;
    state.ideaDraft = text;
    try {
      await post(`${P()}/idea`, { text, base: state.ideaBase ?? "" });
      if (!current(gen)) return;
      Object.assign(state, { editingIdea: false, ideaBase: null, ideaDraft: null, ideaError: "" });
      await refresh();
    } catch (err) {
      if (!current(gen)) return;
      state.ideaError = err.message;
      if (state.tab === "idea") renderPane();
    }
    return;
  }
  if (t.id === "waitingPill") { const n = waitingForYou()[0]; if (n) { state.selected = n.id; state.tab = "node"; render(); } else { state.tab = "inbox"; renderPane(); } }
});
document.addEventListener("input", e => { if (e.target.id === "ideaText") state.ideaDraft = e.target.value; });
$("#me").addEventListener("change", e => store.set("frflow.me", e.target.value.trim()));
$("#jobClose").onclick = () => { state.jobOpen = false; renderJob(); };
$("#project").onchange = e => {
  // What is shown belongs to the old project until the new one is loaded: clear it now.
  state.project = e.target.value; state.gen++; store.set("frflow.project", state.project);
  Object.assign(state, { data: null, history: [], job: null, selected: null, jobOpen: false, editingIdea: false, ideaBase: null, ideaDraft: null, ideaError: "", codeDiffs: {} });
  render(); refresh();
};

loadProjects().then(refresh).then(listen).catch(e => { $("#canvas").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
</script>
