<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrFlow Browser</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6878; --line: #dde2ea; --soft: #eef1f5;
  --accent: #3d5afe; --accent-soft: #e8ecff;
  --proven: #13854b; --proven-soft: #e3f5ea; --open: #b86e00; --open-soft: #fff3dc;
  --failed: #c62f2f; --failed-soft: #fde7e7; --none: #8a94a3; --none-soft: #eef0f3;
  --code: #f3f5f8; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 14px rgba(20,30,50,.06);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --panel: #161b24; --ink: #e5e9f0; --muted: #98a2b3; --line: #29313e; --soft: #1d2430;
    --accent: #8c9eff; --accent-soft: #232b48;
    --proven: #4cc38a; --proven-soft: #15302a; --open: #f0b44c; --open-soft: #33290f;
    --failed: #ff7b7b; --failed-soft: #3a1a1d; --none: #7d8696; --none-soft: #1f252f;
    --code: #10151d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --panel: #161b24; --ink: #e5e9f0; --muted: #98a2b3; --line: #29313e; --soft: #1d2430;
  --accent: #8c9eff; --accent-soft: #232b48;
  --proven: #4cc38a; --proven-soft: #15302a; --open: #f0b44c; --open-soft: #33290f;
  --failed: #ff7b7b; --failed-soft: #3a1a1d; --none: #7d8696; --none-soft: #1f252f;
  --code: #10151d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 6px 0 0;
      overflow-x: auto; white-space: pre-wrap; word-break: break-word; }

header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel);
         border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .2px; }
.brand span { color: var(--accent); }
select, input[type=text], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
textarea { width: 100%; resize: vertical; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 12px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0f131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0f131a; } }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 2px 9px; font-size: 12.5px; }
.spacer { flex: 1; }
.summary { color: var(--muted); font-size: 13px; }
.summary b { color: var(--ink); font-weight: 600; }
.pill { display: none; align-items: center; gap: 8px; border-radius: 7px; padding: 3px 10px; font-size: 13px; }
.pill.show { display: inline-flex; }
.pill.warn { background: var(--open-soft); color: var(--open); border: 1px solid color-mix(in srgb, var(--open) 40%, transparent); }
.pill.you { background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); cursor: pointer; }
.running { display: none; align-items: center; gap: 6px; color: var(--accent); font-size: 13px; }
.running.show { display: inline-flex; }
.dot-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

main { display: grid; grid-template-columns: minmax(0, 1fr) 500px; height: calc(100% - 55px); }
#canvasWrap { position: relative; overflow: auto; }
#canvas { position: relative; margin: 28px auto; }
aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; }
.tab { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; font-size: 11px;
          background: var(--accent); color: #fff; text-align: center; }
.pane { overflow: auto; padding: 16px 18px 40px; flex: 1; }
.pane a { color: var(--accent); text-decoration: none; cursor: pointer; }
.pane a:hover { text-decoration: underline; }

/* tree */
.card { position: absolute; width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 9px 11px; box-shadow: var(--shadow); cursor: pointer; transition: opacity .15s, border-color .15s; }
.card:hover { border-color: var(--accent); }
.card.proposed { border-style: dashed; border-width: 2px; border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--panel)); }
.card.review, .card.settled { border-color: var(--open); border-width: 2px; }
.card.design { background: var(--soft); }
.card.rejected { opacity: .55; border-style: dotted; }
.card.selected { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); border-color: var(--accent); }
.card.dim { opacity: .55; }
.card .top { display: flex; align-items: center; gap: 6px; }
.card .id { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .chips { flex-wrap: nowrap; overflow: hidden; }
.card .stmt { color: var(--muted); font-size: 12.5px; margin: 4px 0 6px; display: -webkit-box; -webkit-line-clamp: 2;
              -webkit-box-orient: vertical; overflow: hidden; min-height: 37px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.kind { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 1px 6px; border-radius: 4px;
        background: var(--soft); color: var(--muted); flex: none; }
.kind.root { background: var(--accent-soft); color: var(--accent); }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.s-proven, .s-accepted, .s-ok { background: var(--proven-soft); color: var(--proven); }
.s-open, .s-waiting, .s-review, .s-settled { background: var(--open-soft); color: var(--open); }
.s-failed, .s-model-error, .s-bad { background: var(--failed-soft); color: var(--failed); }
.s-not-checked, .s-rejected { background: var(--none-soft); color: var(--none); }
.s-proposed { background: var(--accent-soft); color: var(--accent); }
.s-design, .s-removed { background: var(--none-soft); color: var(--muted); }
svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
path.edge { fill: none; stroke-width: 2.2; transition: opacity .15s; }
path.edge.proven { stroke: var(--proven); }
path.edge.open { stroke: var(--open); stroke-dasharray: 7 5; }
path.edge.failed { stroke: var(--failed); stroke-dasharray: 3 4; }
path.edge.unchecked { stroke: var(--none); stroke-dasharray: 2 5; }
path.edge.design, path.edge.informal { stroke: var(--line); stroke-width: 2; }
path.edge.informal { stroke-dasharray: 2 4; }
path.edge.onpath { stroke-width: 4; }
path.glow { fill: none; stroke: var(--proven); stroke-width: 10; opacity: .14; }
path.edge.dim, path.glow.dim { opacity: .3; }
.elabel { position: absolute; transform: translate(-50%, -50%); font-size: 11px; font-weight: 600; padding: 1px 8px;
          border-radius: 999px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; pointer-events: none; }
.elabel.proven { color: var(--proven); border-color: color-mix(in srgb, var(--proven) 45%, transparent); }
.elabel.open { color: var(--open); border-color: color-mix(in srgb, var(--open) 45%, transparent); }
.elabel.failed { color: var(--failed); border-color: color-mix(in srgb, var(--failed) 45%, transparent); }
.elabel.unchecked, .elabel.design, .elabel.informal { color: var(--none); }
.elabel.dim { opacity: .45; }
.legend { position: sticky; left: 12px; bottom: 12px; display: inline-flex; gap: 14px; flex-wrap: wrap; background: var(--panel);
          border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); margin: 0 12px 12px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
.legend .box { display: inline-block; width: 16px; height: 11px; border: 2px dashed var(--accent); border-radius: 3px; vertical-align: middle; margin-right: 5px; }
.empty { color: var(--muted); padding: 40px; }

/* panel */
h2 { font-size: 18px; margin: 0; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 0 6px; }
.lead { font-size: 15px; margin: 8px 0 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.why { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-top: 10px; }
.why .label, .side .label { font-size: 12px; color: var(--muted); }
.box { border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 12px 14px; margin-top: 8px; }
.box.proven, .box.accepted { border-color: color-mix(in srgb, var(--proven) 45%, transparent); border-left-color: var(--proven); background: color-mix(in srgb, var(--proven-soft) 55%, transparent); }
.box.open, .box.review { border-left-color: var(--open); background: color-mix(in srgb, var(--open-soft) 55%, transparent); }
.box.failed { border-left-color: var(--failed); background: color-mix(in srgb, var(--failed-soft) 55%, transparent); }
.box.proposed { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.box.not-checked { border-left-color: var(--none); }
.verdict { font-weight: 650; }
.verdict.proven, .verdict.accepted { color: var(--proven); } .verdict.open { color: var(--open); }
.verdict.failed { color: var(--failed); } .verdict.unchecked { color: var(--none); } .verdict.proposed { color: var(--accent); } .verdict.review { color: var(--open); }
.side { margin-top: 10px; }
.side .label b { color: var(--ink); }
.option { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: var(--panel); }
.option.this { border-color: var(--accent); }
.option label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.warn-text { color: var(--open); font-size: 12.5px; margin-top: 6px; }
.option .head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.diff pre.old { border-color: color-mix(in srgb, var(--failed) 35%, transparent); }
.diff pre.new { border-color: color-mix(in srgb, var(--proven) 35%, transparent); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }
.chain a { color: var(--ink) !important; text-decoration: none !important; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 12px; }
.chain .arrow { font-size: 12px; font-weight: 700; }
.chain .arrow.proven { color: var(--proven); } .chain .arrow.open { color: var(--open); } .chain .arrow.failed { color: var(--failed); }
.chain .arrow.unchecked { color: var(--none); }
del.w { background: var(--failed-soft); color: var(--failed); text-decoration: line-through; }
ins.w { background: var(--proven-soft); color: var(--proven); text-decoration: none; }
pre.worddiff { white-space: pre-wrap; }
.limits { margin-top: 8px; border: 1px dashed var(--open); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--open); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 6px 6px 0; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
details summary { cursor: pointer; color: var(--muted); margin-top: 18px; }
.event { display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.event .d { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--none); }
.event .d.proven, .event .d.accept { background: var(--proven); } .event .d.open { background: var(--open); }
.event .d.failed, .event .d.model-error { background: var(--failed); } .event .d.render { background: var(--accent); }
.event .when { color: var(--muted); font-size: 12px; }
.req { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
.req .answer { margin-top: 6px; padding-left: 10px; border-left: 3px solid var(--proven); }
.md h1 { font-size: 20px; } .md h2 { font-size: 16px; margin-top: 18px; } .md p { margin: 8px 0; }
#job { display: none; position: absolute; right: 16px; bottom: 16px; width: min(560px, calc(100% - 32px)); background: var(--panel);
       border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; z-index: 3; }
#job.show { display: block; }
#job pre { max-height: 240px; overflow: auto; }
#job .head { display: flex; align-items: center; gap: 8px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  #canvasWrap { height: 60vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .legend { position: static; }
  .diff { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Fr<span>Flow</span></div>
  <select id="project" aria-label="Project"></select>
  <span class="summary" id="summary"></span>
  <span class="pill you" id="waitingPill" title="Decisions waiting for you"></span>
  <span class="pill warn" id="stale">Sources changed since the last render <button class="btn small" data-run="render">Render</button></span>
  <span class="running" id="running"><span class="dot-pulse"></span><span id="runningText"></span></span>
  <span class="spacer"></span>
  <input type="text" id="me" placeholder="your name" size="10" aria-label="Your name" title="Recorded with your decisions and requests">
  <button class="btn" data-run="render" title="Rebuild the tree and the Lean from the Scala definitions">Render</button>
  <button class="btn primary" data-run="check" title="Prove the links that changed, in Lean">Check</button>
</header>
<main>
  <div id="canvasWrap">
    <div id="canvas"></div>
    <div class="legend">
      <span><span class="box"></span>proposed: waiting for your decision</span>
      <span><span class="box" style="border-style:solid;border-color:var(--open)"></span>review: something moved under it</span>
      <span><i style="border-color:var(--proven)"></i>link proven</span>
      <span><i style="border-color:var(--open);border-top-style:dashed"></i>open</span>
      <span><i style="border-color:var(--failed);border-top-style:dotted"></i>failed</span>
      <span><i style="border-color:var(--none);border-top-style:dotted"></i>unchecked</span>
    </div>
    <div id="job"><div class="head"><b id="jobTitle"></b><span class="spacer"></span><button class="btn small" id="jobClose">Close</button></div><pre id="jobOut"></pre></div>
  </div>
  <aside>
    <nav class="tabs">
      <button class="tab active" data-tab="node">Node</button>
      <button class="tab" data-tab="inbox">Inbox</button>
      <button class="tab" data-tab="idea">Idea</button>
      <button class="tab" data-tab="vocabulary">Vocabulary</button>
      <button class="tab" data-tab="history">History</button>
    </nav>
    <div class="pane" id="pane"></div>
  </aside>
</main>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const state = { projects: [], project: null, data: null, history: [], job: null, selected: null, tab: "node", jobOpen: false, editingIdea: false, codeDiffs: {} };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => null);
  if (!r.ok) throw new Error(body?.error || r.statusText);
  return body;
}
// The session token comes with the link the server printed; only this browser has it.
const token = (() => {
  const t = new URLSearchParams(location.hash.slice(1)).get("token");
  if (t) { store.set("frflow-token", t); history.replaceState(null, "", location.pathname + location.search); }
  return t || store.get("frflow-token") || "";
})();
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json", "X-FrFlow-Token": token }, body: JSON.stringify(body) });
const P = () => `/api/p/${encodeURIComponent(state.project)}`;

// --- loading ----------------------------------------------------------------

async function loadProjects() {
  state.projects = await api("/api/projects");
  const sel = $("#project");
  sel.innerHTML = state.projects.map(p => `<option>${esc(p.name)}</option>`).join("");
  const [hashProject, hashNode] = decodeURIComponent(location.hash.slice(1)).split("/");
  state.project = state.projects.some(p => p.name === hashProject) ? hashProject
    : state.projects.some(p => p.name === store.get("frflow.project")) ? store.get("frflow.project") : state.projects[0]?.name;
  state.selected = hashNode || null;
  sel.value = state.project;
  $("#me").value = store.get("frflow.me") || "";
}

let loading = null;
async function refresh() {
  if (!state.project) return;
  if (loading) return loading;
  loading = (async () => {
    const [data, history, job] = await Promise.all([api(`${P()}/kb`), api(`${P()}/history`), api(`${P()}/job`)]);
    state.data = data; state.history = history; state.job = job; state.codeDiffs = {};
    if (!live().some(n => n.id === state.selected)) state.selected = (waitingForYou()[0] || live()[0])?.id || null;
    render();
  })().finally(() => { loading = null; });
  return loading;
}

let pendingRefresh = false;
const typing = () => ["TEXTAREA", "INPUT"].includes(document.activeElement?.tagName) && document.activeElement.id !== "me" && document.activeElement.value;
function listen() {
  const es = new EventSource("/api/stream");
  let t = null;
  es.onmessage = () => { clearTimeout(t); t = setTimeout(() => { if (!typing()) refresh(); else pendingRefresh = true; }, 150); };
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRefresh && !typing()) { pendingRefresh = false; refresh(); } }, 200));

// --- model helpers ----------------------------------------------------------

const snap = () => state.data?.snapshot;
const all = () => snap()?.nodes || [];
// Rejected nodes are hidden, unless something still rests on them: then the subtree is shown under them.
const live = () => all().filter(n => n.state !== "rejected" || all().some(c => c.parent === n.id));
const byId = id => all().find(n => n.id === id);
const C = n => n.content || {};
const children = id => live().filter(n => n.parent === id);
function pathTo(id) { const out = []; let n = byId(id); while (n) { out.unshift(n); n = n.parent ? byId(n.parent) : null; } return out; }
const linkStatus = n => n.link?.status || (n.kind === "design" ? "design" : n.parent ? "unchecked" : "root");
// A node resting on a rejected node waits for the agent to move it, not for you.
const waitingForYou = () => live().filter(n => (n.state === "proposed" || n.state === "review" || n.state === "settled") && byId(n.parent)?.state !== "rejected" && !n.settleable);
// Everything the inbox asks of you, counted once, the same everywhere.
const waitingCount = () => waitingForYou().length + gone().length + requests().filter(r => r.status === "answered").length +
  (snap()?.unsigned || []).length + (snap()?.restarts || []).length;
const settledByAgent = () => live().filter(n => n.state === "settled");
const gone = () => snap()?.gone || [];
const siblings = n => live().filter(m => m.parent === n.parent && m.id !== n.id && m.state !== "rejected" && (m.kind === "design") === (n.kind === "design"));
const requests = () => state.data?.requests || [];
const me = () => $("#me").value.trim();
const examplesBad = n => (n.examples || []).filter(e => e.contract !== "ok" || (e.implementation && e.implementation !== "ok"));
const pathProven = n => pathTo(n.id).slice(1).every(p => ["proven", "design", "informal"].includes(linkStatus(p)));
const causeText = { self: "it changed", above: "the meaning of something above it changed", code: "the code it governs changed", revisit: "a change above may affect it", merged: "two branches decided it and both were kept: decide it again" };
function linkLabel(n) {
  const s = linkStatus(n), d = n.link?.detail;
  if (s === "proven") return d === "instantiation" ? "instantiation" : "✓ " + (d === "authored" ? "proof" : "auto");
  return { open: "open", failed: "✗ failed", unchecked: "unchecked", design: "design", informal: "not formalized" }[s] || s;
}

// --- rendering --------------------------------------------------------------

function render() {
  const s = snap();
  const sc = state.data?.sourcesChanged || [];
  $("#stale").classList.toggle("show", !!s && sc.length > 0);
  $("#stale").title = sc.join("\n");
  const running = state.data?.running || (state.job?.running ? { args: state.job.args, actor: "ui" } : null);
  $("#running").classList.toggle("show", !!running);
  $("#runningText").textContent = running ? `${running.actor === "agent" ? "agent" : "running"}: ${running.args.join(" ")}` : "";
  document.querySelectorAll("[data-run]").forEach(b => b.disabled = !!running);
  const w = waitingCount();
  $("#waitingPill").classList.toggle("show", w > 0);
  $("#waitingPill").textContent = `${w} waiting for you`;
  if (!s) {
    $("#summary").textContent = "";
    $("#canvas").innerHTML = `<div class="empty">No snapshot yet. Press Render to build the tree from the Scala definitions.</div>`;
    renderPane(); renderJob();
    return;
  }
  const nodes = live(), links = nodes.filter(n => n.parent && n.kind !== "design");
  const proven = links.filter(n => linkStatus(n) === "proven").length;
  const accepted = nodes.filter(n => n.state === "accepted").length, review = nodes.filter(n => n.state === "review" || n.state === "settled").length;
  const warn = (s.warnings || []).length;
  $("#summary").innerHTML = `${esc(s.name)} · <b>${accepted}</b> accepted · <b>${review}</b> to review · <b>${proven}/${links.length}</b> links proven${warn ? ` · <b style="color:var(--failed)">${warn} warning(s)</b>` : ""} · rendered ${ago(s.exportedAt)}`;
  renderTree(); renderPane(); renderJob();
  history.replaceState(null, "", `#${encodeURIComponent(state.project)}/${encodeURIComponent(state.selected || "")}`);
}

function ago(iso) {
  const sec = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (sec < 60) return "just now";
  if (sec < 3600) return `${Math.round(sec / 60)} min ago`;
  if (sec < 86400) return `${Math.round(sec / 3600)} h ago`;
  return new Date(iso).toLocaleString();
}

const W = 230, H = 104, GX = 24, GY = 70;

function chips(n) {
  const bad = examplesBad(n).length, ex = (n.examples || []).length;
  const st = n.state === "review" ? `review: ${(n.causes || []).join(", ")}` : n.state;
  return `<span class="chip s-${n.state}" title="${esc((n.causes || []).map(c => causeText[c]).join("; "))}">${esc(st)}</span>
    ${ex ? `<span class="chip ${bad ? "s-bad" : "s-ok"}" title="examples">examples ${ex - bad}/${ex}</span>` : ""}
    `;
}

function renderTree() {
  const canvas = $("#canvas");
  const pos = {}; let slot = 0;
  function place(n, depth) {
    const cs = children(n.id);
    cs.forEach(c => place(c, depth + 1));
    const x = cs.length ? (pos[cs[0].id].x + pos[cs[cs.length - 1].id].x) / 2 : (slot++) * (W + GX);
    pos[n.id] = { x, y: depth * (H + GY) };
  }
  live().filter(n => !n.parent).forEach(r => { place(r, 0); slot += 0.4; });
  const ps = Object.values(pos);
  if (!ps.length) { canvas.innerHTML = `<div class="empty">No nodes.</div>`; return; }
  const width = Math.max(...ps.map(p => p.x)) + W, height = Math.max(...ps.map(p => p.y)) + H;
  const onPath = new Set(state.selected ? pathTo(state.selected).map(n => n.id) : []);
  const dimOthers = onPath.size > 1;
  let svg = "", labels = "", cards = "";
  for (const n of live()) {
    if (!n.parent || !pos[n.parent] || !pos[n.id]) continue;
    const a = pos[n.parent], b = pos[n.id];
    const x1 = a.x + W / 2, y1 = a.y + H, x2 = b.x + W / 2, y2 = b.y, my = (y1 + y2) / 2;
    const d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
    const st = linkStatus(n), on = onPath.has(n.id), dim = dimOthers && !on ? " dim" : "";
    if (st === "proven") svg += `<path class="glow${dim}" d="${d}"/>`;
    const cls = n.link?.detail === "instantiation" ? "design" : st; // nothing to prove: drawn neutral
    svg += `<path class="edge ${cls}${on ? " onpath" : ""}${dim}" d="${d}"/>`;
    labels += `<div class="elabel ${cls}${dim}" style="left:${(x1 + x2) / 2}px;top:${my}px">${esc(linkLabel(n))}</div>`;
  }
  for (const n of live()) {
    const p = pos[n.id]; if (!p) continue;
    const cls = ["card", n.state, n.kind === "design" ? "design" : "", n.id === state.selected ? "selected" : "", dimOthers && !onPath.has(n.id) ? "dim" : ""].join(" ");
    cards += `<div class="${cls}" data-node="${esc(n.id)}" style="left:${p.x}px;top:${p.y}px;height:${H}px">
      <div class="top"><span class="kind ${n.kind}">${esc(n.kind)}</span><span class="id" title="${esc(n.id)}">${esc(n.id)}</span></div>
      <div class="stmt" title="${esc(C(n).statement)}">${esc(C(n).statement)}</div>
      <div class="chips">${chips(n)}</div>
    </div>`;
  }
  canvas.style.width = width + "px"; canvas.style.height = height + "px";
  canvas.innerHTML = `<svg width="${width}" height="${height}">${svg}</svg>${labels}${cards}`;
}

function renderJob() {
  const j = state.job, box = $("#job");
  box.classList.toggle("show", !!j && state.jobOpen);
  if (!j) return;
  const st = j.running ? "running…" : j.exitCode === 0 ? "done" : `exit ${j.exitCode}`;
  $("#jobTitle").textContent = `${j.args.join(" ")} — ${st}`;
  $("#jobOut").textContent = j.running ? "Running the knowledge base's CLI…" : j.output;
}

function renderPane() {
  const counts = { inbox: waitingCount() };
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === state.tab);
    const n = counts[t.dataset.tab];
    t.innerHTML = t.dataset.tab[0].toUpperCase() + t.dataset.tab.slice(1) + (n ? `<span class="n">${n}</span>` : "");
  });
  if (!snap() && state.tab !== "idea") { $("#pane").innerHTML = ""; return; }
  // A redraw (for example after a live update) keeps what the developer is typing or ticking.
  const keep = state.tab === "node" && $("#reason") ? { node: state.selected, reason: $("#reason").value,
    ticks: [...document.querySelectorAll("#pane input[type=checkbox]")].map(x => [x.className, x.value, x.checked]) } : null;
  $("#pane").innerHTML = { node: nodePane, inbox: inboxPane, idea: ideaPane, vocabulary: vocabularyPane, history: historyPane }[state.tab]();
  if (keep && keep.node === state.selected) {
    if ($("#reason")) $("#reason").value = keep.reason;
    for (const [c, v, on] of keep.ticks) {
      const el = [...document.querySelectorAll("#pane input[type=checkbox]")].find(x => x.className === c && x.value === v);
      if (el) el.checked = on;
    }
  }
}

function code(label, src) { return src ? `<div class="side"><div class="label">${label}</div><pre>${esc(src)}</pre></div>` : ""; }

function modelOf(n) {
  const c = C(n), src = c.sources || {};
  if (n.kind === "instantiate") return `<div class="side"><div class="label">substitutions</div><pre>${esc((c.substitutions || []).join("\n"))}</pre></div>`;
  return code("abs — maps this model to the parent's", src.abs) + code("spec", src.spec) + code("post — every call (a, b) ⇒ r satisfies", src.post) + code("implementation — built by", C(n).implementation);
}

function verdict(n) {
  const s = linkStatus(n), d = n.link?.detail || "";
  if (s === "proven") {
    if (d === "instantiation") return "Nothing to prove: the parent's theorems apply with these substitutions. Whether they mean the right things in the world is your decision.";
    if (d === "authored") return "Proven by a proof the agent wrote, replayed through the Lean kernel. Read it before accepting: a proof can also go through because the node contradicts itself, which the automatic check does not always catch.";
    return "Proven automatically by frflow_auto.";
  }
  if (s === "informal") return "Not formalized: this node opted out of Lean (formal = false). Read its model against its parent; that reading is your decision. A contract's examples and run-time check still apply.";
  if (s === "open") return `Open: ${esc(d)}`;
  if (s === "failed") return `Failed: ${esc(d)}`;
  return `Unchecked: ${esc(d || "not checked yet")}.`;
}

// A word-level diff: what was decided, against what is there now.
function wordDiff(a, b) {
  const x = (a || "").split(/(\s+)/), y = (b || "").split(/(\s+)/);
  if (x.length * y.length > 250000) return `<del class="w">${esc(a)}</del>\n<ins class="w">${esc(b)}</ins>`;
  const m = x.length, n = y.length, L = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < m && j < n) {
    if (x[i] === y[j]) { out += esc(x[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { out += `<del class="w">${esc(x[i++])}</del>`; }
    else { out += `<ins class="w">${esc(y[j++])}</ins>`; }
  }
  while (i < m) out += `<del class="w">${esc(x[i++])}</del>`;
  while (j < n) out += `<ins class="w">${esc(y[j++])}</ins>`;
  return out;
}

function diff(old, cur) {
  const flat = c => ({
    parent: c.parent, statement: c.statement, why: c.why, idea: c.idea, "not modelled": c.notModelled,
    ...Object.fromEntries(Object.entries(c.sources || {})),
    substitutions: (c.substitutions || []).join("\n"), examples: (c.examples || []).join("\n"),
    implementation: c.implementation, vocabulary: (c.vocabulary || []).join("\n"), "definitions used": (c.uses || []).join("\n\n"), governs: (c.governs || []).join("\n"),
    "invariants kept": (c.keeps || []).join("\n"), "out of Lean": c.formal === false ? "yes" : "",
  });
  const a = flat(old || {}), b = flat(cur || {});
  const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(k => (a[k] || "") !== (b[k] || ""));
  if (!keys.length) return "";
  return keys.map(k => `<div class="side"><div class="label">${esc(k)}</div><pre class="worddiff">${wordDiff(a[k], b[k])}</pre></div>`).join("");
}

async function loadCodeDiff(id) {
  if (state.codeDiffs[id] !== undefined) return;
  state.codeDiffs[id] = null;
  try { state.codeDiffs[id] = (await api(`${P()}/codediff?node=${encodeURIComponent(id)}`)).diff; } catch { state.codeDiffs[id] = ""; }
  if (state.selected === id && state.tab === "node") renderPane();
}

const reasonBox = (placeholder, value = "") =>
  `<div class="side"><div class="label">your reason (kept as part of the theory)</div><textarea id="reason" rows="2" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`;

function warnings(n) {
  const w = [];
  if (n.kind !== "design" && n.parent && !["proven", "informal"].includes(linkStatus(n))) w.push(`its link is ${linkStatus(n)}`);
  if (examplesBad(n).length) w.push(`${examplesBad(n).length} example(s) fail`);
  (n.invariants || []).filter(i => !["proven", "informal"].includes(i.status)).forEach(i => w.push(`invariant ${i.id} is ${i.status}`));
  return w;
}

// What moved since the decision, shown whether or not it can be accepted yet.
function whatMoved(n) {
  const d = n.history?.filter(h => h.action === "accept" || h.action === "confirm").slice(-1)[0];
  let h = "";
  for (const c of n.causes || []) {
    if (c === "self") h += `<div class="side"><div class="label">${esc(n.id)} changed since it was accepted</div>${diff(d?.content, n.content) || `<div class="muted small">No difference in what was decided.</div>`}</div>`;
    if (c === "above" && byId(n.parent)?.state === "rejected")
      h += `<div class="side"><div class="label"><a data-goto="${esc(n.parent)}">${esc(n.parent)}</a>, which it rests on, was rejected</div><div class="muted small">The agent moves it under the node chosen instead, or removes it.</div></div>`;
    if (c === "above") for (const m of n.moved || [])
      h += `<div class="side"><div class="label"><a data-goto="${esc(m.id)}">${esc(m.id)}</a> changed in meaning since this was decided</div>${diff(m.before, C(byId(m.id))) || ""}</div>`;
    if (c === "revisit") {
      const r = (n.history || []).filter(x => x.action === "revisit").slice(-1)[0];
      h += `<div class="side"><div class="label">${esc(r?.by || "")} asked to revisit it</div>${esc(r?.reason || "")}</div>`;
    }
    if (c === "code") {
      loadCodeDiff(n.id);
      const cd = state.codeDiffs[n.id];
      h += `<div class="side"><div class="label">the code it governs changed: ${esc((n.code?.files || []).join(", "))}</div>
        ${cd === null || cd === undefined ? `<div class="muted small">loading the diff…</div>` : cd ? `<pre class="mono">${esc(cd)}</pre>` : `<div class="muted small">No diff available (the change was made before the decision was committed, or outside git). The examples ${examplesBad(n).length ? "fail" : "still pass"}.</div>`}</div>`;
    }
  }
  return h;
}

// What a node governs, in full, before it is first decided: what is accepted is seen.
function governedFiles(n) {
  loadCodeDiff(n.id);
  const cd = state.codeDiffs[n.id];
  return `<details><summary>the files it governs, in full (${esc((n.code.files || []).join(", "))}) — read them before accepting</summary>
    ${cd === null || cd === undefined ? `<div class="muted small">loading…</div>` : `<pre class="mono">${esc(cd)}</pre>`}</details>`;
}

// The decisions above a new node, with their reasons: where "revisit if …" is written.
function aboveReasons(n) {
  const above = pathTo(n.id).slice(0, -1).filter(a => a.decision);
  const invs = (n.invariants || []).map(i => byId(i.id)).filter(Boolean);
  if (!above.length && !invs.length) return "";
  return `<div class="side"><div class="label">the decisions it rests on, with their reasons: does it meet a condition they set for revisiting them?</div>
    ${[...above, ...invs].map(a => `<div class="small"><a data-goto="${esc(a.id)}"><b>${esc(a.id)}</b></a>: ${esc(a.decision?.reason || "")}</div>`).join("")}</div>`;
}

// Back to the agent, with what to change: a request on the node.
const sendBack = n => `<button class="btn small" data-sendback="${esc(n.id)}">Send back to the agent</button>`;

// The decision: where the theory is built. The developer chooses, with a reason.
function decisionBox(n) {
  const d = n.decision;
  const blocked = !!n.waitsFor; // from core: a proposal, or a node whose parent moved, waits for its parent
  const later = d ? (n.history || []).filter(h => ["accept", "confirm", "revisit"].includes(h.action) && h.at > d.at) : [];
  const verb = { accept: "change accepted", confirm: "re-confirmed", revisit: "asked to revisit", settle: "settled by the agent" };
  const chosen = d ? `<div class="why"><div class="label">chosen by ${esc(d.by)} because</div>${esc(d.reason)}</div>
    ${later.map(c => `<div class="muted small">${verb[c.action]} by ${esc(c.by)}: ${esc(c.reason)}</div>`).join("")}` : "";
  const alts = n.alternatives || [];
  const altList = alts.length ? `<div class="side"><div class="label">rejected alternatives</div>${alts.map(r =>
    `<div class="option"><b>${esc(r.id)}</b> — ${esc(r.content?.statement)}<div class="muted small">${esc(r.content?.why)}</div></div>`).join("")}</div>` : "";
  const button = (label, extra = "") => blocked
    ? `<div class="muted small">Accept <a data-goto="${esc(n.waitsFor)}">${esc(n.waitsFor)}</a> first: what rests on it is decided after it.</div>`
    : `<div class="actions"><button class="btn small primary" data-accept="1" ${extra}>${label}</button></div>`;
  if (n.state === "proposed") {
    const others = siblings(n), warn = warnings(n);
    return `<div class="box proposed"><div class="verdict proposed">${others.some(o => o.state === "proposed") ? "Choose between the proposals" : "Proposed"}</div>
      <div class="muted small">Choosing keeps your reason; what you reject is kept as an alternative.</div>
      ${others.length ? `<div class="side"><div class="label">other nodes beside it, under the same parent — each is its own part of the parent unless you tick it: a ticked node is replaced by this one</div>${others.map(o => `<div class="option">
        <div class="head"><a data-goto="${esc(o.id)}"><b>${esc(o.id)}</b></a>${chips(o)}</div>
        <div class="small" style="margin-top:4px">${esc(C(o).statement)}</div><div class="muted small">${esc(C(o).why)}</div>
        <label><input type="checkbox" class="rej" value="${esc(o.id)}" ${o.state === "proposed" ? "checked" : ""}> reject ${esc(o.id)}${o.state === "accepted" || o.state === "settled" ? " (replaces a decided node)" : ""}</label></div>`).join("")}</div>` : ""}
      ${warn.length ? `<div class="warn-text">Note: ${esc(warn.join("; "))}.</div>` : ""}
      ${(n.resembles || []).map(x => `<div class="warn-text">It says what <a data-goto="${esc(x.id)}">${esc(x.id)}</a> said, which was rejected: ${esc(x.reason)}</div>`).join("")}
      ${aboveReasons(n)}
      ${n.code ? governedFiles(n) : ""}
      ${altList}
      ${reasonBox("Why this one (or why not)? What would make you revisit it?")}
      ${button(`Accept ${esc(n.id)}`)}<div class="actions"><button class="btn small" data-reject-self="1">Reject ${esc(n.id)}</button> ${sendBack(n)}</div></div>`;
  }
  if (n.state === "review") {
    // The decisions below that this decision acts on, from core, with their reasons: where the
    // conditions for revisiting them are written.
    const listed = n.below || [];
    const moved = listed.some(b => b.kind === "moved");
    const belowList = ((n.causes || []).includes("self") || moved) && listed.length ? `<div class="side"><div class="label">decisions below, with their reasons — tick those this change may affect: they are reviewed again. The others still hold${moved ? "; those that moved only because of this are confirmed with your reason" : ""}.</div>${listed.map(b => `<div class="option">
        <div class="head"><a data-goto="${esc(b.id)}"><b>${esc(b.id)}</b></a>${b.kind === "moved" ? ` <span class="muted small">(moved with this)</span>` : ""}</div>
        <div class="small" style="margin-top:4px">${esc(b.statement)}</div>
        <div class="muted small">chosen because: ${esc(b.reason)}</div>
        <label><input type="checkbox" class="rev" value="${esc(b.id)}" data-moved="${b.kind === "moved" ? 1 : ""}"> revisit ${esc(b.id)}</label></div>`).join("")}</div>` : "";
    const warn = warnings(n);
    return `<div class="box review"><div class="verdict review">To review: ${esc((n.causes || []).map(c => causeText[c]).join("; "))}</div>
      ${warn.length ? `<div class="warn-text">Note: ${esc(warn.join("; "))}.</div>` : ""}
      ${chosen}${whatMoved(n)}${altList}${belowList}
      ${reasonBox((n.causes || []).includes("self") ? "Why is the change right?" : "Why does it still hold, given what changed?")}
      ${button("Accept", "")}<div class="actions">${sendBack(n)}</div></div>`;
  }
  if (n.state === "settled") {
    const a = n.settledByAgent, mine = n.developerDecision;
    if (n.code) loadCodeDiff(n.id);
    const cd = n.code ? state.codeDiffs[n.id] : "";
    return `<div class="box review"><div class="verdict review">Settled by the agent — endorse it, or ask for a change</div>
      <div class="muted small">The agent settled this as mechanical: Lean proves its link, its examples pass, and it introduces no term and no choice. Status fails until you endorse it. What it changed since your last decision is below.</div>
      <div class="why"><div class="label">the agent's reason</div>${esc(a.reason)}</div>
      ${mine ? `<div class="side"><div class="label">changed since you decided it (${new Date(mine.at).toLocaleString()})</div>${diff(mine.content, n.content) || `<div class="muted small">Nothing in what it says.</div>`}</div>`
        : `<div class="side"><div class="label">you have not decided it before: all of it is new</div></div>`}
      ${n.code ? `<div class="side"><div class="label">the code it governs, ${mine ? "changed since your decision" : "in full"}: ${esc((n.code.files || []).join(", "))}</div>
        ${cd === null || cd === undefined ? `<div class="muted small">loading…</div>` : cd ? `<pre class="mono">${esc(cd)}</pre>` : `<div class="muted small">No change in the code since your decision.</div>`}</div>` : ""}
      ${chosen && d && d.action !== "settle" ? chosen : ""}${altList}
      ${reasonBox("Why does it hold?")}
      <div class="actions"><button class="btn small primary" data-accept="1">Endorse</button> ${sendBack(n)}</div></div>`;
  }
  return `<div class="box accepted"><div class="verdict accepted">Accepted</div>
    <div class="muted small">${d ? new Date(d.at).toLocaleString() : ""}</div>${chosen}${altList}</div>`;
}

function examplesTable(n) {
  const limits = n.limits || [];
  const lim = limits.length ? `<div class="limits"><b>Does not promise:</b><ul style="margin:4px 0 0 18px;padding:0">${limits.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>` : "";
  if (!(n.examples || []).length) return lim ? `<h3>Limits</h3>${lim}` : "";
  const res = (r, expected) => r === "ok" ? `<span class="chip s-ok">${expected ? "allows ✓" : "refuses ✓"}</span>` : r ? `<span class="chip s-bad">${esc(r)}</span>` : `<span class="muted small">—</span>`;
  let rows = "", given = null;
  for (const e of n.examples) {
    const g = e.given.join(", ");
    if (g !== given) { given = g; rows += `<tr><td colspan="4" class="mono muted small" style="padding-top:10px">given ${esc(g)}</td></tr>`; }
    rows += `<tr><td><span class="chip ${e.expected ? "s-ok" : "s-not-checked"}">${e.expected ? "expect" : "reject"}</span></td>
      <td>${esc(e.note)}<div class="mono muted">${esc(e.call)}</div></td>
      <td>${res(e.contract, e.expected)}</td><td>${e.expected ? (e.implementation === "ok" ? `<span class="chip s-ok">returns it ✓</span>` : res(e.implementation, true)) : `<span class="muted small">—</span>`}</td></tr>`;
  }
  return `<h3>Examples</h3><div class="muted small">What this contract means in concrete cases, checked against the contract and against the implementation.</div>
    <table><tr><th></th><th>case</th><th>contract</th><th>implementation</th></tr>${rows}</table>${lim}`;
}

function requestsFor(node) {
  const rs = requests().filter(r => r.node === node && r.status !== "closed");
  return rs.map(r => `<div class="req"><div class="small"><b>${esc(r.by)}</b> <span class="muted">${new Date(r.at).toLocaleString()} · ${esc(r.status)}</span></div>
    <div>${esc(r.text)}</div>
    ${r.answer ? `<div class="answer small"><span class="muted">agent:</span> ${esc(r.answer)}</div>` : ""}
    ${r.status === "answered" ? `<div class="actions"><button class="btn small" data-close="${esc(r.id)}">Done</button></div>` : ""}</div>`).join("");
}

function askBox(node, placeholder) {
  return `<textarea id="ask" rows="2" placeholder="${esc(placeholder)}"></textarea>
    <div class="actions"><button class="btn small" data-ask="${esc(node)}">Send to the agent</button>
    <span class="muted small">The agent sees it in its inbox and answers with proposals.</span></div>`;
}

function nodePane() {
  const n = byId(state.selected);
  if (!n) return `<p class="muted">Select a node.</p>`;
  const c = C(n), parent = n.parent ? byId(n.parent) : null, ls = linkStatus(n);
  let h = `<div style="display:flex;align-items:center;gap:8px"><span class="kind ${n.kind}">${esc(n.kind)}</span><h2>${esc(n.id)}</h2></div>
    <div class="chips" style="margin-top:6px">${chips(n)}</div>
    <p class="lead">${esc(c.statement)}</p>
    <div class="why"><div class="label">why</div>${esc(c.why)}</div>
    ${examplesTable(n)}`;
  if (n.kind === "design") {
    h += `<h3>Design decision</h3><div class="box"><div class="muted small">No formal model: decided and tracked like the rest, and every change to the files it governs is yours to review:</div>
      <pre>${esc((n.code?.files || []).join("\n") || "—")}</pre></div>`;
  } else if (n.kind === "invariant") {
    h += `<h3>Invariant</h3><div class="box"><div class="muted small">One rule, stated once. Every contract in its scope keeps it, listing the pairs a call exposes to the rule (proven from the contract's post in Lean, and checked on its examples and at run time), or says why it does not apply.</div>
      ${code("rule", (c.sources || {}).spec)}
      ${(n.covers || []).map(id => { const k = (byId(id)?.invariants || []).find(i => i.id === n.id) || {};
        return `<div class="side"><div class="label">kept by <a data-goto="${esc(id)}">${esc(id)}</a> — ${esc(k.status || "")}${k.detail ? ": " + esc(k.detail) : ""}</div><pre>${esc(k.view || "")}</pre></div>`; }).join("")}
      ${(n.exempts || []).map(id => { const k = (byId(id)?.invariants || []).find(i => i.id === n.id) || {};
        return `<div class="side"><div class="label"><a data-goto="${esc(id)}">${esc(id)}</a> is exempt</div><div class="small">${esc(k.detail || "")}</div></div>`; }).join("")}</div>`;
  } else if (!parent) {
    h += `<h3>Root</h3><div class="box"><div class="muted">One concern of the idea, stated as a theorem. Every node below is proven to imply it.</div>${code("spec", (c.sources || {}).spec)}</div>`;
  } else {
    h += `<h3>Link to parent</h3><div class="box ${ls}">
      <div class="verdict ${ls}">${verdict(n)}</div>
      <div class="side"><div class="label">parent <b><a data-goto="${esc(parent.id)}">${esc(parent.id)}</a></b> (${esc(parent.kind)})</div>
        <div style="margin-top:2px">${esc(C(parent).statement)}</div>
        ${(C(parent).sources || {}).spec ? `<pre>${esc(C(parent).sources.spec)}</pre>` : parent.kind === "instantiate" ? `<div class="muted small">its spec is its parent's, instantiated</div>` : ""}</div>
      <div class="side"><div class="label">this node <b>${esc(n.id)}</b></div>${modelOf(n)}</div>
      ${n.code ? `<div class="side"><div class="label">governs</div><div class="mono small">${esc(n.code.files.join(", "))}</div></div>` : ""}
      ${n.kind === "contract" ? `<div class="side"><div class="label">implementation</div><div class="small">${n.implementationProof
        ? `${esc(n.implementationProof.name)}: ${esc(n.implementationProof.status)}${n.implementationProof.detail ? " — " + esc(n.implementationProof.detail) : ""}`
        : C(n).implementation ? `plain Scala, checked on its ${(n.examples || []).length} examples, every combination of their inputs, and at run time by service: not proven` : "none registered"}</div></div>` : ""}
      ${(n.invariants || []).map(i => i.status === "exempt"
        ? `<div class="side"><div class="label">exempt from <a data-goto="${esc(i.id)}">${esc(i.id)}</a></div><div class="small">${esc(i.detail)}</div></div>`
        : `<div class="side"><div class="label">keeps <a data-goto="${esc(i.id)}">${esc(i.id)}</a> — ${esc(i.status)}${i.detail ? ": " + esc(i.detail) : ""}</div>
          <div class="muted small">the pairs a call shows to the rule:</div><pre>${esc(i.view)}</pre><div class="muted small">the rule:</div><pre>${esc(i.rule)}</pre></div>`).join("")}
      ${n.proof ? `<details ${n.state !== "accepted" ? "open" : ""}><summary>authored proof — ${esc(n.proof.file)}</summary><pre>${esc(n.proof.source)}</pre></details>` : ""}
    </div>`;
  }
  h += `<h3>Decision</h3>${decisionBox(n)}`;
  if (n.messages?.length) h += `<h3>Messages</h3><pre>${esc(n.messages.join("\n\n"))}</pre>`;
  h += `<h3>Ask the agent</h3>${requestsFor(n.id)}
    ${askBox(n.id, n.kind === "contract" ? "e.g. Add an example: a revoked grant refuses access." : "e.g. Propose how to refine this: tokens expire after an hour.")}
    <div class="actions">
      ${n.kind !== "design" ? `<button class="btn small" data-run="check" data-arg="${esc(n.id)}">Check this node</button>` : ""}
      ${ls === "open" && !n.proof && n.obligation ? `<button class="btn small" data-run="scaffold" data-arg="${esc(n.id)}">Create proof file</button>` : ""}
    </div>`;
  const read = pathTo(n.id).slice(1).filter(p => linkStatus(p) === "informal").length;
  if (n.kind !== "design" && n.kind !== "invariant") h += `<details><summary>Root theorem — ${!pathProven(n) ? "holds once every link on the path is proven" : read ? `holds as far as Lean goes: ${read} link(s) on the path are decided by reading, not proven` : "holds: every link from the root is proven"}</summary>
      <div class="chain">${pathTo(n.id).map((p, i) => (i ? `<span class="arrow ${linkStatus(p)}">${linkStatus(p) === "proven" ? "⟵✓" : "⟵?"}</span>` : "") +
        `<a data-goto="${esc(p.id)}">${esc(p.id)}</a>`).join("")}</div><pre>${esc(n.rootTheorem)}</pre></details>
    ${n.obligation ? `<details><summary>Obligation in Lean</summary><pre>${esc(n.obligation.statement)}</pre></details>` : ""}
    <details><summary>Generated Lean</summary><pre>${esc(n.lean)}</pre></details>`;
  return h;
}

// Reviews caused by one change, decided at once with one reason: nodes that moved only because the
// same nodes above them changed, or whose only change is the same definitions they use.
function batches(w) {
  const key = n => {
    if (n.waitsFor) return null;
    const cs = (n.causes || []).join();
    if (cs === "above") return "above:" + (n.moved || []).map(m => m.id).sort().join(",");
    if (cs === "self") {
      const d = (n.history || []).filter(h => h.action === "accept" || h.action === "confirm").slice(-1)[0]?.content || {};
      const changed = Object.keys({ ...d, ...C(n) }).filter(k => JSON.stringify(d[k] ?? null) !== JSON.stringify(C(n)[k] ?? null));
      if (changed.length === 1 && changed[0] === "uses") return "uses:" + (C(n).uses || []).join("\n");
    }
    return null;
  };
  const groups = {};
  for (const n of w) { const k = key(n); if (k) (groups[k] ||= []).push(n); }
  return Object.entries(groups).filter(([, ns]) => ns.length > 1).map(([k, ns]) => {
    const ids = ns.map(n => n.id).join(",");
    const what = k.startsWith("above:") ? `moved only because ${k.slice(6).split(",").map(x => `<a data-goto="${esc(x)}">${esc(x)}</a>`).join(", ")} changed`
      : "changed only in the definitions they use (the same change)";
    return `<div class="box review" style="margin-top:0"><div class="verdict review">${ns.length} nodes ${what}</div>
      <div class="small">${ns.map(n => `<a data-goto="${esc(n.id)}">${esc(n.id)}</a>`).join(", ")} — open one to see the change; Lean ${ns.every(n => ["proven", "informal"].includes(linkStatus(n)) || n.kind === "design") ? "proves their links again" : "has not proven all their links yet"}.</div>
      <textarea data-batchreason="${esc(ids)}" rows="1" placeholder="Why do they all still hold?"></textarea>
      <div class="actions"><button class="btn small" data-batch="${esc(ids)}">Accept all ${ns.length}</button></div></div>`;
  }).join("");
}

// A review caused only by an ancestor's change that is itself waiting is decided with it: grouped under it.
function followers(n, w) {
  if ((n.causes || []).join() !== "above") return null;
  const m = (n.moved || []).map(x => x.id).find(id => w.some(x => x.id === id));
  return m || null;
}

function inboxPane() {
  const w = waitingForYou();
  const answered = requests().filter(r => r.status === "answered");
  const open = requests().filter(r => r.status === "open");
  const rejected = all().filter(n => n.state === "rejected");
  const warns = snap()?.warnings || [];
  return `${warns.length ? `<div class="box failed" style="margin-top:0"><div class="verdict failed">Warnings</div>${warns.map(x => `<div class="small">${esc(x)}</div>`).join("")}</div>` : ""}
    ${(snap()?.unsigned || []).length ? `<div class="box review" style="margin-top:0"><div class="verdict review">Decisions not signed by your key</div>
      <div class="muted small">Each decision you make here is signed with your key; these are not. One you did not make was written into the ledger by someone else: decide that node again. Sign only the ones that are yours.</div>
      ${snap().unsigned.map(u => `<label class="small" style="display:block"><input type="checkbox" class="unsigned" value="${esc(u.entry)}"> <a data-goto="${esc(u.node)}">${esc(u.node)}</a>: ${esc(u.action)} by ${esc(u.by)}, ${new Date(u.at).toLocaleString()} — ${esc(u.reason)}</label>`).join("")}
      <div class="actions"><button class="btn small" data-sign="1">These are mine: sign them</button></div></div>` : ""}
    ${(snap()?.restarts || []).map(({ commit: c, why }) => `<div class="box review" style="margin-top:0"><div class="verdict review">${esc(why)}: commit ${esc(c.slice(0, 10))}</div>
      <div class="muted small">A commit removed or changed recorded decisions (a deleted ledger, or a revert). Check in git what changed (git show ${esc(c.slice(0, 10))}), then say why it is right.</div>
      <textarea class="removal" data-restart="${esc(c)}" rows="1" placeholder="Why is it right?"></textarea>
      <div class="actions"><button class="btn small primary" data-ack="${esc(c)}">Acknowledge</button></div></div>`).join("")}
    ${batches(w)}
    <h3 style="margin-top:0">Waiting for you</h3>${w.length ? w.filter(n => !followers(n, w)).map(n =>
      `<div class="req"><a data-goto="${esc(n.id)}"><b>${esc(n.id)}</b></a> ${chips(n)}<div class="small">${esc(C(n).statement)}</div>
      ${w.filter(f => followers(f, w) === n.id).map(f => `<div class="muted small">↳ <a data-goto="${esc(f.id)}">${esc(f.id)}</a> moved with it: decided together, from its review</div>`).join("")}</div>`).join("")
      : gone().length ? "" : `<div class="muted small">Nothing. Every node is accepted.</div>`}
    ${gone().map(r => `<div class="req"><b>${esc(r.id)}</b> <span class="chip s-review">gone from the model</span>
      <div class="small">${esc(r.decision?.content?.statement)}</div>
      <textarea class="removal" data-node="${esc(r.id)}" rows="1" placeholder="Why is it gone?"></textarea>
      <div class="actions"><button class="btn small primary" data-gone="${esc(r.id)}">Accept that it is gone</button></div></div>`).join("")}
    ${settledByAgent().length ? `<h3>Settled by the agent — waits for your endorsement</h3>${settledByAgent().map(n => `<div class="req"><a data-goto="${esc(n.id)}"><b>${esc(n.id)}</b></a>
      <div class="small">${esc(C(n).statement)}</div><div class="answer small"><span class="muted">agent:</span> ${esc(n.settledByAgent.reason)}</div></div>`).join("")}` : ""}
    ${live().some(n => n.settleable) ? `<div class="muted small" style="margin-top:8px">${live().filter(n => n.settleable).length} mechanical decision(s) left to the agent: ${live().filter(n => n.settleable).map(n => `<a data-goto="${esc(n.id)}">${esc(n.id)}</a>`).join(", ")}.</div>` : ""}
    <h3>Answered by the agent</h3>${answered.length ? answered.map(r => `<div class="req"><div class="small">on ${r.node ? `<a data-goto="${esc(r.node)}">${esc(r.node)}</a>` : "the idea"}</div>
      <div>${esc(r.text)}</div><div class="answer small"><span class="muted">agent:</span> ${esc(r.answer)}</div>
      <div class="actions"><button class="btn small" data-close="${esc(r.id)}">Done</button></div></div>`).join("") : `<div class="muted small">None.</div>`}
    <h3>Waiting for the agent</h3>${open.length ? open.map(r => `<div class="req"><div class="small">on ${r.node ? `<a data-goto="${esc(r.node)}">${esc(r.node)}</a>` : "the idea"} · ${esc(r.by)}</div><div>${esc(r.text)}</div></div>`).join("") : `<div class="muted small">None.</div>`}
    ${rejected.length ? `<div class="muted small" style="margin-top:8px">${rejected.length} rejected node(s) still in the Scala model; the agent removes them.</div>` : ""}
    <h3>Ask about the whole idea</h3>${askBox("", "e.g. Propose a second root: users can always find the records they may see.")}`;
}

function markdown(src) {
  const out = []; let list = null, para = [], fence = null;
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  const flush = () => { if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`); para = []; if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; } };
  for (const line of src.split("\n")) {
    if (fence !== null) { if (line.startsWith("```")) { out.push(`<pre>${esc(fence.join("\n"))}</pre>`); fence = null; } else fence.push(line); continue; }
    if (line.startsWith("```")) { flush(); fence = []; continue; }
    const hd = line.match(/^(#{1,4})\s+(.*)/), li = line.match(/^\s*[-*]\s+(.*)/);
    if (hd) { flush(); out.push(`<h${hd[1].length}>${inline(hd[2])}</h${hd[1].length}>`); }
    else if (li) { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } (list ||= []).push(`<li>${inline(li[1])}</li>`); }
    else if (!line.trim()) flush();
    else para.push(line.trim());
  }
  flush();
  return out.join("");
}

function ideaPane() {
  const s = snap();
  if (state.editingIdea) return `<div class="muted small">IDEA.md. A change puts the roots up for review. When you accept a root, tick the decisions below whose reasons the change may affect: they are reviewed again.</div>
    <textarea id="ideaText" rows="22" class="mono">${esc(s?.idea || "")}</textarea>
    <div class="actions"><button class="btn small primary" id="saveIdea">Save</button><button class="btn small" id="cancelIdea">Cancel</button></div>`;
  const roots = live().filter(n => !n.parent && n.kind === "root");
  return `<div class="actions" style="margin-top:0"><span class="muted small">Roots, one concern each: ${roots.map(r => `<a data-goto="${esc(r.id)}">${esc(r.id)}</a>`).join(", ") || "none"}</span>
      <span class="spacer"></span><button class="btn small" id="editIdea">Edit</button></div>
    <div class="md">${markdown(s?.idea || "*No idea file.*")}</div>
    <div class="muted small">List what the tree deliberately leaves out under “## Not modelled”, so the limits of the theory are explicit.</div>`;
}

function vocabularyPane() {
  const s = snap();
  return `<h3 style="margin-top:0">Vocabulary</h3><div class="muted small">The open terms of the model and what they mean in the world. A change to a meaning puts the nodes that use the term up for review.</div>
    <table><tr><th>term</th><th>means</th><th>Lean type</th></tr>
    ${s.opaques.map(o => `<tr><td class="mono">${esc(o.name)}</td><td>${esc(o.means)}</td><td class="mono muted">Type</td></tr>`).join("")}
    ${s.params.map(p => `<tr><td class="mono">${esc(p.name)}</td><td>${esc(p.means)}</td><td class="mono muted">${esc(p.type)}</td></tr>`).join("")}</table>
    <h3>Domain types</h3>${s.types.map(t => `<pre>${esc(t.lean)}</pre>`).join("") || "<span class='muted'>none</span>"}
    <h3>Definitions</h3>${s.defs.map(d => `<div class="side"><div class="label"><b>${esc(d.name)}</b></div><pre>${esc(d.source)}</pre></div>`).join("") || "<span class='muted'>none</span>"}`;
}

function historyPane() {
  const hs = state.history || [];
  const verb = { accept: "accepted", confirm: "re-confirmed", reject: "rejected", remove: "agreed is gone", revisit: "to revisit", settle: "settled by the agent" };
  return hs.length ? `<div class="muted small">Every decision, from the ledger (committed with the code).</div>` + hs.map(e =>
    `<div class="event"><span class="d ${esc(e.action)}"></span><div><a data-goto="${esc(e.node)}"><b>${esc(e.node)}</b></a> ${esc(verb[e.action] || e.action)} by ${esc(e.by)}${(e.rejected || []).length ? `, rejecting ${esc(e.rejected.join(", "))}` : ""}
      <div class="small">${esc(e.reason)}</div><div class="when">${new Date(e.at).toLocaleString()}</div></div></div>`).join("") : `<p class="muted">No decisions yet.</p>`;
}

// --- actions ----------------------------------------------------------------

async function run(args) {
  try { state.jobOpen = true; state.job = await post(`${P()}/run`, { args }); render(); } catch (e) { alert(e.message); }
}

function needName() {
  if (me()) return me();
  $("#me").focus(); alert("Enter your name at the top right: it is recorded with your decisions and requests.");
  return null;
}

async function decide(body) {
  try { await post(`${P()}/decide`, body); await refresh(); } catch (e) { alert(e.message); }
}

document.addEventListener("click", async e => {
  const t = e.target;
  const go = t.closest("[data-goto]");
  if (go) { e.preventDefault(); state.selected = go.dataset.goto; state.tab = "node"; render(); return; }
  const card = t.closest(".card");
  if (card) { state.selected = card.dataset.node; state.tab = "node"; render(); return; }
  const r = t.closest("[data-run]");
  if (r) { run([r.dataset.run, ...(r.dataset.arg ? [r.dataset.arg] : [])]); return; }
  const tab = t.closest(".tab");
  if (tab) { state.tab = tab.dataset.tab; renderPane(); return; }
  const acc = t.closest("[data-accept]");
  if (acc) {
    const who = needName(); if (!who) return;
    const reason = $("#reason")?.value.trim() || "";
    if (reason.split(/\s+/).filter(w => /\p{L}/u.test(w)).length < 3) { $("#reason")?.focus(); alert("Give your reason in a few words: it is kept as part of the theory."); return; }
    const n = byId(state.selected);
    const reject = [...document.querySelectorAll(".rej:checked")].map(x => x.value);
    const revisit = [...document.querySelectorAll(".rev:checked")].map(x => x.value);
    const confirmBelow = [...document.querySelectorAll(".rev:not(:checked)")].filter(x => x.dataset.moved).map(x => x.value);
    const warn = warnings(n);
    if (warn.length && !confirm(`${n.id}: ${warn.join("; ")}. Accept it anyway?`)) return;
    // Leaving every decision below as it is, is a choice too: ask for it explicitly.
    const listedBelow = document.querySelectorAll(".rev").length;
    if (listedBelow && !revisit.length && !confirm(`None of the ${listedBelow} decision(s) below is affected by this change: their reasons still hold?`)) return;
    decide({ node: n.id, by: who, reason, reject, revisit, confirm: confirmBelow, seen: n.version });
    return;
  }
  if (t.closest("[data-reject-self]")) {
    const who = needName(); if (!who) return;
    const reason = $("#reason")?.value.trim() || "";
    if (reason.split(/\s+/).filter(w => /\p{L}/u.test(w)).length < 3) { $("#reason")?.focus(); alert("Say why not, in a few words: it is kept as part of the theory."); return; }
    decide({ node: state.selected, by: who, reason, action: "reject", seen: byId(state.selected).version });
    return;
  }
  const sb = t.closest("[data-sendback]");
  if (sb) {
    const who = needName(); if (!who) return;
    const text = $("#reason")?.value.trim() || "";
    if (text.split(/\s+/).filter(w => /\p{L}/u.test(w)).length < 3) { $("#reason")?.focus(); alert("Say what to change, in a few words, in the reason box."); return; }
    try { await post(`${P()}/requests`, { node: sb.dataset.sendback, text, by: who }); await refresh(); } catch (err) { alert(err.message); }
    return;
  }
  const ba = t.closest("[data-batch]");
  if (ba) {
    const who = needName(); if (!who) return;
    const ids = ba.dataset.batch.split(",");
    const reason = document.querySelector(`textarea[data-batchreason="${ba.dataset.batch}"]`)?.value.trim() || "";
    if (reason.split(/\s+/).filter(w => /\p{L}/u.test(w)).length < 3) { alert("Say why they still hold, in a few words."); return; }
    for (const id of ids) { const x = byId(id); if (x) { try { await post(`${P()}/decide`, { node: id, by: who, reason, seen: x.version }); } catch (err) { alert(`${id}: ${err.message}`); break; } } }
    await refresh();
    return;
  }
  if (t.closest("[data-sign]")) {
    const entries = [...document.querySelectorAll(".unsigned:checked")].map(x => x.value);
    if (!entries.length) { alert("Tick the decisions that are yours."); return; }
    try { await post(`${P()}/sign`, { entries }); await refresh(); } catch (err) { alert(err.message); }
    return;
  }
  const ack = t.closest("[data-ack]");
  if (ack) {
    const who = needName(); if (!who) return;
    const reason = document.querySelector(`[data-restart="${ack.dataset.ack}"]`)?.value.trim() || "";
    if (reason.split(/\s+/).filter(w => /\p{L}/u.test(w)).length < 3) { alert("Say why the restart is right, in a few words."); return; }
    decide({ node: "_ledger", by: who, reason, action: "acknowledge", seen: ack.dataset.ack });
    return;
  }
  const gn = t.closest("[data-gone]");
  if (gn) {
    const who = needName(); if (!who) return;
    const reason = document.querySelector(`.removal[data-node="${gn.dataset.gone}"]`)?.value.trim();
    if ((reason || "").split(/\s+/).filter(w => /\p{L}/u.test(w)).length < 3) { alert("Say why it is gone, in a few words."); return; }
    decide({ node: gn.dataset.gone, by: who, reason });
    return;
  }
  const ask = t.closest("[data-ask]");
  if (ask) {
    const who = needName(); if (!who) return;
    const text = $("#ask").value.trim(); if (!text) { $("#ask").focus(); return; }
    try { await post(`${P()}/requests`, { node: ask.dataset.ask, text, by: who }); $("#ask").value = ""; refresh(); } catch (err) { alert(err.message); }
    return;
  }
  const close = t.closest("[data-close]");
  if (close) { try { await post(`${P()}/requests/${encodeURIComponent(close.dataset.close)}`, { status: "closed" }); refresh(); } catch (err) { alert(err.message); } return; }
  if (t.id === "editIdea") { state.editingIdea = true; renderPane(); return; }
  if (t.id === "cancelIdea") { state.editingIdea = false; renderPane(); return; }
  if (t.id === "saveIdea") {
    try { await post(`${P()}/idea`, { text: $("#ideaText").value }); state.editingIdea = false; await refresh(); } catch (err) { alert(err.message); }
    return;
  }
  if (t.id === "waitingPill") { const n = waitingForYou()[0]; if (n) { state.selected = n.id; state.tab = "node"; render(); } else { state.tab = "inbox"; renderPane(); } }
});
$("#me").addEventListener("change", e => store.set("frflow.me", e.target.value.trim()));
$("#jobClose").onclick = () => { state.jobOpen = false; renderJob(); };
$("#project").onchange = e => { state.project = e.target.value; store.set("frflow.project", state.project); state.selected = null; state.jobOpen = false; refresh(); };

loadProjects().then(refresh).then(listen).catch(e => { $("#canvas").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
</script>
